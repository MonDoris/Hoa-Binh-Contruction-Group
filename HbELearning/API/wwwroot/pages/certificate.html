    <style>
/* ================= DANH SÁCH CHỨNG NHẬN VIP ================= */
.vip-cert-list { 
    display: flex; 
    flex-direction: column; 
    gap: 16px; 
}

/* Mặt thẻ, vệt sáng, con dấu chìm và số hiệu lấy từ .cert-card trong css/style.css — ở đây chỉ đặt tông
   màu vàng kim và bố cục hàng ngang ba khối (thông tin / chỉ số / nút). */
.vip-cert-item {
    --cert-tint: #fde68a;
    --cert-glow: rgba(245, 158, 11, .15);
    --cert-glow-strong: rgba(245, 158, 11, .4);
    --cert-shine: rgba(255, 215, 0, .3);
    --cert-ink: #b45309;
    display: flex; align-items: center; gap: 24px; padding: 20px 24px;
}
.vip-cert-item:hover { border-color: #fbbf24; }

/* Con dấu ở đây nằm giữa thẻ và thở nhẹ theo nhịp, khác thẻ thu gọn ở trang tài khoản (nép vào góc). */
.vip-cert-item .cert-card-stamp {
    right: 20%; top: 50%; font-size: 160px; opacity: .06; color: #d97706;
    animation: vipStampPulse 4s alternate infinite ease-in-out;
}
@keyframes vipStampPulse {
    from { transform: translateY(-50%) scale(1); opacity: .06; }
    to   { transform: translateY(-50%) scale(1.1); opacity: .12; }
}

/* Bố cục nội dung thẻ */
.vip-cert-main { flex: 2; min-width: 0; }
.vip-cert-item .cert-card-no { font-size: 15px; }
.vip-cert-item .cert-card-no i { color: #eab308; font-size: 18px; filter: drop-shadow(0 2px 4px rgba(234, 179, 8, .4)); }
.vip-cert-user { font-size: 15px; margin-bottom: 4px; color: var(--text); }
.vip-cert-user span { font-size: 12.5px; color: var(--text-muted); font-weight: normal; margin-left: 8px; }
.vip-cert-course { font-size: 17px; }

.vip-cert-meta { 
    flex: 1; display: flex; flex-direction: column; gap: 8px; 
    font-size: 13px; border-left: 1px dashed #fbbf24; padding-left: 20px; 
}
.vip-cert-meta b { color: var(--text); }
.vip-cert-score b { font-size: 18px; color: var(--primary); font-family: "Consolas", monospace; }

.vip-cert-actions { 
    flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; 
    border-left: 1px dashed #fbbf24; padding-left: 20px; z-index: 3; 
}
.vip-cert-actions .btn { width: 110px; justify-content: center; }

/* Trạng thái bị thu hồi */
.vip-cert-item.revoked { border-color: var(--danger); box-shadow: 0 4px 20px -5px rgba(220, 38, 38, 0.15); }
.vip-cert-item.revoked:hover { box-shadow: 0 15px 35px -5px rgba(220, 38, 38, 0.4); border-color: var(--danger); }
.vip-cert-item.revoked { --cert-shine: rgba(220, 38, 38, .2); --cert-ink: #991b1b; }
.vip-cert-item.revoked .cert-card-stamp { color: var(--danger); }
.vip-cert-item.revoked .cert-card-no i { color: #f87171; }
.vip-cert-item.revoked .vip-cert-meta, .vip-cert-item.revoked .vip-cert-actions { border-left-color: var(--danger); }

/* ================= CHỨNG NHẬN CỦA NHÂN VIÊN CẤP DƯỚI =================
   Ba tầng: đầu khối (đang xem phòng ban nào) → dải số liệu tổng quan → hai cột "danh sách nhân viên | chứng
   nhận của người đang chọn". Danh sách luôn nằm bên trái chứ không giấu trong một ô chọn: người quản lý thường
   rà vài người liền nhau, nhìn thấy cả phòng một lượt (ai có, ai chưa có chứng nhận) mới là thứ họ cần. */
.sub-box { overflow: hidden; }
.sub-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px; flex-wrap: wrap; }
.sub-head-icon {
    flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    font-size: 22px; color: var(--primary); background: var(--primary-light);
}
.sub-head-text { flex: 1; min-width: 200px; }
.sub-head-text h3 { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
.sub-head-text p { margin-top: 2px; font-size: 13px; color: var(--text-muted); }
/* Nhiều phòng ban: ô chọn phòng ban nằm ngay trên đầu khối — nó đổi CẢ dải số liệu lẫn danh sách bên dưới. */
.sub-dept { width: 300px; max-width: 100%; }

.sub-kpi { margin: 0 20px 18px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sub-kpi .ops-kpi-cell { padding: 14px 18px 12px; }
.sub-kpi .ops-kpi-value { font-size: 26px; }

.sub-layout {
    display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
    border-top: 1px solid var(--border); min-height: 420px;
}

/* ----- Cột trái: tìm + lọc + danh sách người ----- */
.sub-people { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); background: var(--bg); }
.sub-people-tools { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-bottom: 1px solid var(--border); }
.sub-search { position: relative; }
.sub-search i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
.sub-search input {
    width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px;
}
.sub-search input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.sub-search input:disabled { opacity: .6; cursor: not-allowed; }

.sub-seg { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.sub-seg button {
    flex: 1; min-width: 0; padding: 6px 4px; border: 0; border-radius: 7px; background: transparent; cursor: pointer;
    font: 600 12px/1.2 var(--font-sans, inherit); color: var(--text-muted); white-space: nowrap;
}
.sub-seg button.on { background: var(--primary-light); color: var(--primary-dark); }
.sub-seg button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

.sub-people-list { flex: 1; overflow-y: auto; max-height: 560px; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.sub-person {
    display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; text-align: left;
    border: 1px solid transparent; border-radius: 10px; background: transparent; color: inherit; cursor: pointer;
    font: inherit; transition: background .15s, border-color .15s;
}
.sub-person:hover { background: var(--surface); }
.sub-person:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.sub-person.on { background: var(--surface); border-color: var(--primary); box-shadow: var(--shadow-xs); }
.sub-person .avatar { width: 38px; height: 38px; font-size: 14px; }
.sub-person-text { flex: 1; min-width: 0; }
.sub-person-text b, .sub-person-text small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub-person-text b { font-size: 13.5px; font-weight: 700; }
.sub-person-text small { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
/* Số chứng nhận: xanh khi có, xám khi chưa — kèm con số, không để màu là tín hiệu duy nhất. */
.sub-count {
    flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 700; background: var(--border); color: var(--text-muted);
}
.sub-count.has { background: color-mix(in srgb, var(--success) 14%, var(--surface)); color: var(--success); }
/* "Tất cả phòng ban": nhãn tên phòng đứng đầu mỗi nhóm người, dính lên đỉnh khi cuộn. */
.sub-group-label {
    position: sticky; top: -8px; z-index: 1; display: flex; align-items: center; gap: 6px;
    margin: 8px -8px 2px; padding: 6px 12px; background: var(--bg);
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: var(--text-muted);
}
.sub-group-label:first-child { margin-top: -8px; }
.sub-group-label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-group-label small { font-size: 11px; font-weight: 700; }
.sub-list-note {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 18px 12px; text-align: center; font-size: 12.5px; color: var(--text-muted); line-height: 1.5;
}
.sub-list-note i { font-size: 28px; opacity: .7; }

/* ----- Cột phải: chứng nhận của người đang chọn ----- */
.sub-panel { min-width: 0; padding: 20px; container-type: inline-size; }
.sub-profile {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px dashed var(--border);
}
.sub-profile .avatar { width: 56px; height: 56px; font-size: 20px; }
.sub-profile-text { flex: 1; min-width: 180px; }
.sub-profile-text h4 { font-size: 18px; font-weight: 800; letter-spacing: -.2px; }
.sub-profile-text p { margin-top: 3px; font-size: 13px; color: var(--text-muted); }
.sub-profile-chips { display: flex; gap: 6px; flex-wrap: wrap; }
/* Đầu khung đã ghi tên, mã và phòng ban — trên từng thẻ chứng nhận bên dưới thì bỏ dòng đó cho đỡ lặp. */
.sub-panel .vip-cert-user { display: none; }

/* ================= CHỨNG NHẬN TOÀN CÔNG TY =================
   Bộ lọc (phòng ban → nhân viên → từ khóa) rồi danh sách gom theo phòng ban, trong mỗi phòng gom theo người. */
.ac-tools { margin-bottom: 20px; }
.ac-tools .register-filter-row .field { min-width: 240px; }
@media (max-width: 600px) { .ac-tools .register-filter-row .field { min-width: 100%; } }
.ac-summary { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.ac-summary h3 { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
.ac-summary .muted { font-size: 13px; }
.ac-summary .btn { margin-left: auto; align-self: center; }

/* Mỗi phòng ban là một <details> thu gọn sẵn — bấm dòng tên phòng mới xổ danh sách người ra. */
.ac-dept { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
.ac-dept + .ac-dept { margin-top: 12px; }
.ac-dept-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; cursor: pointer; list-style: none; border-radius: 14px;
}
.ac-dept-head::-webkit-details-marker { display: none; }
.ac-dept-head:hover { background: var(--bg); }
.ac-dept-head:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.ac-dept[open] > .ac-dept-head { border-bottom: 1px solid var(--border); border-radius: 14px 14px 0 0; }
.ac-dept-caret { font-size: 16px; color: var(--text-muted); transition: transform .2s; }
.ac-dept[open] .ac-dept-caret { transform: rotate(180deg); }
.ac-dept-body { padding: 16px; }
/* Dãy ảnh đại diện chồng mép — nhìn dòng phòng ban đã biết trong đó có những ai. */
.ac-dept-faces { display: flex; margin-left: auto; padding-left: 8px; }
.ac-dept-faces .avatar { width: 28px; height: 28px; font-size: 11px; border: 2px solid var(--surface); margin-left: -8px; }
.ac-dept-faces .ac-more { background: var(--border); color: var(--text-muted); font-weight: 700; }
.ac-dept-icon {
    flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    font-size: 17px; color: var(--primary); background: var(--primary-light);
}
.ac-dept-head h3 { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
.ac-dept-head .muted { font-size: 13px; }

.ac-person + .ac-person { margin-top: 20px; }
.ac-person-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-left: 2px; }
.ac-person-head .avatar { width: 34px; height: 34px; font-size: 13px; }
.ac-person-text { flex: 1; min-width: 0; }
.ac-person-text b { display: block; font-size: 14.5px; font-weight: 700; }
.ac-person-text small { display: block; font-size: 12px; color: var(--text-muted); }
/* Tên, mã và phòng ban đã nằm ở đầu nhóm — bỏ dòng đó trên từng thẻ cho đỡ lặp. */
.ac-person .vip-cert-user { display: none; }

.sub-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    min-height: 340px; padding: 24px; color: var(--text-muted);
}
.sub-empty-icon {
    width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 14px;
    font-size: 34px; color: var(--primary); background: var(--primary-light);
}
.sub-empty h4 { font-size: 15.5px; font-weight: 700; color: var(--text); }
.sub-empty p { max-width: 340px; margin-top: 4px; font-size: 13px; line-height: 1.55; }

/* Khung phải hẹp (màn vừa) thì thẻ chứng nhận xếp dọc, dù cửa sổ còn rộng hơn mốc 820px bên dưới. */
@container (max-width: 640px) {
    .vip-cert-item { flex-direction: column; align-items: stretch; gap: 14px; padding: 16px; }
    .vip-cert-meta, .vip-cert-actions { border-left: none; border-top: 1px dashed #fbbf24; padding-left: 0; padding-top: 14px; }
    .vip-cert-item.revoked .vip-cert-meta, .vip-cert-item.revoked .vip-cert-actions { border-top-color: var(--danger); }
    .vip-cert-actions { flex-direction: row; }
    .vip-cert-actions .btn { flex: 1; }
}

@media (max-width: 900px) {
    .sub-layout { grid-template-columns: minmax(0, 1fr); }
    .sub-people { border-right: 0; border-bottom: 1px solid var(--border); }
    .sub-people-list { max-height: 320px; }
}
@media (max-width: 640px) {
    .sub-head { padding: 14px 16px; }
    .sub-kpi { margin: 0 16px 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .sub-kpi .ops-kpi-cell { padding: 10px 12px; border-left: 1px solid var(--border); border-top: 0; }
    .sub-kpi .ops-kpi-cell:first-child { border-left: 0; }
    .sub-kpi .ops-kpi-icon { display: none; }
    .sub-kpi .ops-kpi-value { font-size: 22px; }
    .sub-panel { padding: 16px; }
    .sub-dept { width: 100%; }
}

/* Responsive cho điện thoại */
@media (max-width: 820px) {
    .vip-cert-item { flex-direction: column; align-items: stretch; gap: 16px; padding: 16px; }
    .vip-cert-meta, .vip-cert-actions { border-left: none; border-top: 1px dashed #fbbf24; padding-left: 0; padding-top: 16px; }
    .vip-cert-actions { flex-direction: row; }
    .vip-cert-actions .btn { flex: 1; }
}

/* ==================== THẺ TRANG ==================== */
.cert-tabs { margin-bottom: 18px; }
.cert-tabs .tab-count {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 2px;
    border-radius: 999px; background: #f97316; color: #fff; font-size: 10.5px; font-weight: 800;
}

/* ==================== CHỨNG NHẬN BÊN NGOÀI — DANH SÁCH ==================== */
.ext-hero {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 18px 20px; margin-bottom: 16px; border-radius: 16px; border: 1px solid var(--border);
    background: linear-gradient(120deg, var(--primary-soft), var(--surface) 65%);
}
.ext-hero h3 { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
.ext-hero p { margin-top: 4px; max-width: 640px; font-size: 13px; line-height: 1.55; color: var(--text-muted); }

.ext-list { display: flex; flex-direction: column; gap: 10px; }
/* Một giấy = một dòng thẻ; vạch màu bên trái nói trạng thái trước cả khi đọc chữ (vàng chờ, xanh đã xác nhận,
   đỏ bị từ chối) — kèm huy hiệu chữ, không để màu là tín hiệu duy nhất. */
.ext-card {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 14px;
    padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
}
.ext-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border); }
.ext-card.status-pending::before { background: var(--warning); }
.ext-card.status-approved::before { background: var(--success); }
.ext-card.status-rejected::before { background: var(--danger); }
.ext-card-icon {
    width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
    font-size: 26px; color: var(--primary); background: var(--primary-light);
}
.ext-card-top { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.ext-card-top h4 { font-size: 14.5px; font-weight: 700; }
.ext-card-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 5px; font-size: 12.5px; color: var(--text-muted); }
.ext-card-meta span { display: inline-flex; align-items: center; gap: 5px; }
.ext-card-reason { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--danger); }
.ext-card-actions { display: flex; gap: 6px; }
.ext-badge i { vertical-align: -1px; margin-right: 2px; }
@media (max-width: 640px) {
    .ext-card { grid-template-columns: 40px minmax(0, 1fr); }
    .ext-card-icon { width: 40px; height: 40px; font-size: 22px; }
    .ext-card-actions { grid-column: 1 / -1; }
}

/* ==================== HỘP THOẠI "THÊM CHỨNG NHẬN" ==================== */
.ext-add-body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .ext-add-body { grid-template-columns: minmax(0, 1fr); } }
.ext-mode {
    display: flex; gap: 3px; padding: 3px; margin-bottom: 12px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
}
.ext-mode button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 10px; border: 0; border-radius: 9px; background: transparent; cursor: pointer;
    font: 600 13px/1.2 var(--font-sans); color: var(--text-muted);
}
.ext-mode button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-xs); }

/* Khung quét: ảnh camera trực tiếp + khung ngắm. Phần ngoài khung tối đi (box-shadow trải rộng), bốn góc
   sáng — đúng thứ người ta quen thấy ở ứng dụng quét giấy, và cũng chính là vùng sẽ được cắt khi chụp. */
.scan-frame { position: relative; overflow: hidden; border-radius: 14px; background: #0b1220; }
.scan-frame video, .scan-frame canvas, .scan-frame img { display: block; width: 100%; height: auto; }
.scan-guide { position: absolute; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(2, 6, 23, .45); transition: all .25s ease; }
.scan-guide i { position: absolute; width: 22px; height: 22px; border: 3px solid #fff; }
.scan-guide .tl { left: -3px; top: -3px; border-right: 0; border-bottom: 0; border-top-left-radius: 7px; }
.scan-guide .tr { right: -3px; top: -3px; border-left: 0; border-bottom: 0; border-top-right-radius: 7px; }
.scan-guide .bl { left: -3px; bottom: -3px; border-right: 0; border-top: 0; border-bottom-left-radius: 7px; }
.scan-guide .br { right: -3px; bottom: -3px; border-left: 0; border-top: 0; border-bottom-right-radius: 7px; }
.scan-tip {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: calc(100% - 20px);
    padding: 6px 12px; border-radius: 999px; background: rgba(2, 6, 23, .65); color: #fff;
    font-size: 12px; text-align: center;
}
.scan-wait { display: grid; place-items: center; gap: 8px; min-height: 240px; color: #cbd5e1; font-size: 13px; text-align: center; padding: 20px; }
.scan-wait i { font-size: 34px; }
.scan-bar { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 12px; }
.scan-shutter {
    width: 60px; height: 60px; border-radius: 50%; cursor: pointer;
    border: 4px solid var(--primary); background: var(--primary);
    box-shadow: inset 0 0 0 4px var(--surface); transition: transform .1s ease;
}
.scan-shutter:active { transform: scale(.93); }
.scan-shutter:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }
.scan-side {
    display: inline-flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px;
    border: 0; background: transparent; cursor: pointer; color: var(--text-muted); font: 600 11px/1.2 var(--font-sans);
}
.scan-side i { font-size: 20px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.scan-side:hover i { border-color: var(--primary); }

.ext-drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 250px; padding: 24px; cursor: pointer; text-align: center;
    border: 2px dashed var(--border); border-radius: 14px; background: var(--bg); color: var(--text-muted);
    transition: border-color .15s ease, background-color .15s ease;
}
.ext-drop:hover, .ext-drop.drag { border-color: var(--primary); background: var(--primary-soft); color: var(--text); }
.ext-drop i { font-size: 40px; color: var(--primary); }
.ext-drop b { color: var(--text); font-size: 14px; }
.ext-preview iframe { width: 100%; height: 340px; border: 0; border-radius: 12px; background: #fff; }
.ext-preview-bar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--text-muted); }
.ext-preview-bar .file { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ext-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; color: var(--text); }
.ext-toggle input { width: 16px; height: 16px; }

/* Ô "AI đọc giấy" trên đầu cột thông tin: đang đọc / đã điền sẵn / chỗ lệch. Màu theo kết quả, luôn kèm icon và
   chữ — không để màu là tín hiệu duy nhất. */
.ext-ai {
    display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; padding: 11px 13px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
    font-size: 12.5px; line-height: 1.5; color: var(--text-muted);
}
.ext-ai > i { font-size: 20px; line-height: 1; margin-top: 1px; color: var(--primary); }
.ext-ai b { color: var(--text); }
.ext-ai .spinner { width: 18px; height: 18px; margin: 1px 0 0; flex-shrink: 0; }
.ext-ai.ok { border-color: color-mix(in srgb, var(--success) 35%, transparent); background: var(--success-light); }
.ext-ai.ok > i { color: var(--success); }
.ext-ai.warn { border-color: color-mix(in srgb, var(--warning) 40%, transparent); background: var(--warning-light); }
.ext-ai.warn > i { color: var(--warning); }
.ext-ai.bad { border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: var(--danger-light); }
.ext-ai.bad > i, .ext-ai.bad b { color: var(--danger); }
.ext-ai ul { margin: 4px 0 0; padding-left: 16px; }
.ext-ai-holder { display: block; margin-top: 3px; }

/* "AI đọc được trên giấy" trong hộp thoại xem: mỗi mục một dòng, dấu ✓ / ✗ / – theo kết quả so. */
.ext-ai-read { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.ext-ai-read h5 { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12.5px; font-weight: 800; color: var(--text); }
.ext-ai-read ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 12.5px; }
.ext-ai-read li { display: grid; grid-template-columns: 16px 104px minmax(0, 1fr); gap: 6px; align-items: start; }
.ext-ai-read li span { color: var(--text-muted); }
.ext-ai-read li b { font-weight: 600; overflow-wrap: anywhere; }
.ext-ai-read .ok { color: var(--success); }
.ext-ai-read .bad { color: var(--danger); }
.ext-ai-read .skip { color: var(--text-muted); }
.ext-ai-tag { margin-left: 4px; padding: 0 5px; border-radius: 5px; font-size: 10px; font-weight: 800; background: var(--primary-light); color: var(--primary); }

/* ==================== HỘP THOẠI XEM TỆP / DUYỆT ==================== */
.ext-view-body { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 760px) { .ext-view-body { grid-template-columns: minmax(0, 1fr); } }
.ext-view-file {
    display: grid; place-items: center; min-height: 320px; overflow: hidden;
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
}
.ext-view-file img { display: block; max-width: 100%; max-height: 62vh; }
.ext-view-file iframe { width: 100%; height: 62vh; border: 0; background: #fff; }
.ext-view-info h4 { font-size: 16px; font-weight: 800; line-height: 1.35; margin-bottom: 10px; }
.ext-view-info dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; font-size: 13px; }
.ext-view-info dt { color: var(--text-muted); }
.ext-view-info dd { font-weight: 600; overflow-wrap: anywhere; }
.ext-view-reason { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--danger-light); color: var(--danger); font-size: 12.5px; }

/* ==================== DUYỆT (Admin) ==================== */
.ext-filter { display: flex; gap: 8px; flex-wrap: wrap; }
.ext-filter select, .ext-filter input { width: auto; min-width: 170px; }

/* ==================== IN DANH SÁCH (Admin) ====================
   Bản xem trước là chính tờ giấy sẽ in: nền trắng, chữ mực đen, viền bảng mảnh — kể cả khi đang bật giao diện
   tối, vì giấy in không có chế độ tối. */
.register-filter-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.register-filter-row .field { margin-bottom: 0; min-width: 150px; }
.register-filter-row .field.grow { flex: 1; min-width: 200px; }

/* 1. Giao diện trang in (.reg-sheet) */
.reg-sheet {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif; /* Đảm bảo font rõ ràng, hiện đại */
    --ink: #111827;
    --ink-2: #6b7280;
    --rule: #d1d5db;
    max-width: 1120px;
    margin: 16px auto 0;
    padding: 32px 36px;
    border: 1px solid var(--border); 
    border-radius: 6px; 
    box-shadow: var(--shadow-lg);
    background: #fff; 
    color: var(--ink); 
    font-size: 13px;
    line-height: 1.5;
}

/* 2. Header: Flexbox dàn đều 2 bên */
.reg-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #374151; /* Đường kẻ viền dày giống form hành chính */
    padding-bottom: 16px;
    margin-bottom: 24px;
}
.reg-brand {
    display: flex;
    align-items: center;
    gap: 16px;
}
.reg-brand img {
    height: 48px;
    width: auto;
    object-fit: contain;
}
.reg-brand-text b {
    display: block;
    font-size: 18px;
    color: #0369a1; /* Màu xanh tương đồng logo HB */
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.reg-brand-text span {
    display: block;
    font-size: 13px;
    color: var(--ink-2);
}
.reg-meta {
    text-align: right;
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.6;
}

/* 3. Title & Summary */
.reg-title {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 8px;
    color: var(--ink);
    letter-spacing: 0.5px;
}
.reg-sub {
    text-align: center;
    font-size: 13px;
    color: var(--ink-2);
    margin-bottom: 16px;
}
.reg-summary {
    display: flex;
    justify-content: center;
    gap: 24px;
    font-size: 14px;
    margin-bottom: 24px;
    color: #4b5563;
}
.reg-summary b {
    color: var(--ink);
    font-weight: 600;
    margin-left: 4px;
}

/* 4. Bảng dữ liệu */
.reg-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 40px;
    font-size: 13px;
}
.reg-table th, .reg-table td {
    padding: 12px 10px;
    border: 1px solid var(--rule);
    text-align: left;
    vertical-align: middle; /* Canh giữa nội dung theo chiều dọc */
    color: var(--ink);
}
.reg-table th {
    background-color: #f3f4f6; /* Nền xám nhạt cho header */
    color: #374151;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
}
.reg-table th.c, .reg-table td.c {
    text-align: center;
}
/* Tránh bị đổi màu khi hover vào bảng lúc đang chuẩn bị in */
.reg-table tbody tr:hover {
    background: transparent;
}
.reg-table tr.reg-group td { 
    background: #f8fafc; 
    font-weight: 800; 
}

/* Kiểu chữ riêng cho tên/mô tả trong bảng */
.reg-table b {
    font-size: 14px; /* Tên nhân viên to hơn chút */
}
.reg-table .muted2 {
    display: block;
    color: var(--ink-2);
    font-size: 11px;
    margin-top: 2px;
}

/* Nguồn (badge) */
.reg-src {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid #d1d5db; /* Viền xám mặc định (Nội bộ) */
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    color: #4b5563;
    white-space: nowrap;
}
.reg-src.ext {
    border-color: #3b82f6; /* Viền xanh (Bên ngoài) */
    color: #3b82f6;
}

.reg-empty {
    text-align: center;
    padding: 40px;
    color: var(--ink-2);
    border: 1px dashed var(--rule);
    background: #f9fafb;
    margin-bottom: 40px;
}

/* 5. Chữ ký */
.reg-sign {
    display: flex;
    justify-content: space-around; /* Dàn đều 2 cụm chữ ký */
    margin-top: 30px;
    font-size: 14px;
}
.reg-sign > div {
    text-align: center;
    width: 40%;
}
.reg-sign .date {
    font-style: italic;
    color: #4b5563;
    margin-bottom: 8px;
    min-height: 21px;
}
.reg-sign b {
    display: block;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink);
}
.reg-sign .hint {
    font-style: italic;
    color: var(--ink-2);
    font-size: 12px;
    margin-top: 4px;
}
.reg-sign .space {
    height: 100px; /* Không gian để ký */
}

/* 6. Thiết lập in ấn */
@page register-sheet { size: A4 landscape; margin: 15mm; }
@media print {
    body.printing-register .main .content > :not(#tab-register),
    body.printing-register #tab-register > :not(#rg-sheet-wrap),
    body.printing-register .modal-mask,
    body.printing-register .skip-link,
    body.printing-register #toast-box,
    body.printing-register #global-loading-overlay { display: none !important; }
    
    body.printing-register #tab-register { display: block !important; }
    body.printing-register { background: #fff !important; }
    
    .reg-sheet {
        page: register-sheet; 
        max-width: none; 
        margin: 0; 
        padding: 0;
        border: 0; 
        border-radius: 0; 
        box-shadow: none;
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact;
    }
    
    .reg-table thead { display: table-header-group; } /* lặp lại dòng tiêu đề ở đầu mỗi trang */
    .reg-table tr, .reg-sign { break-inside: avoid; } /* Không để hàng hoặc vùng ký tên bị cắt ngang trang */
}

/* ================= TỜ CHỨNG NHẬN HOÀN THÀNH (hbc) =================
   Ý tưởng: tờ chứng nhận là một BẢN VẼ KỸ THUẬT CÔNG TRÌNH của Hòa Bình. Giấy kẻ ô xanh nhạt, khung bản vẽ có đánh số
   vùng, vòng "chi tiết" chứa linh vật (đội mũ kỹ sư, cầm bản vẽ) và ô tiêu đề ở chân tờ giống khung tên của bản vẽ.
   Bảng màu chỉ có một tông: xanh mực + xanh bản vẽ trên nền giấy xanh nhạt, cộng một điểm nhấn cam an toàn lấy từ chiếc
   áo và mỏ của linh vật (chỉ dùng ở ba chỗ nhỏ), nên các màu luôn cùng họ với nhau.
   Cỡ chữ và khoảng cách tính theo cqw (bề ngang tờ) nên co giãn đúng tỉ lệ trong hộp thoại, trên di động và khi in.
   Nghiêng 3D, vệt sáng và thị sai của linh vật chỉ có khi xem trên màn hình: in ra là tờ phẳng. */
.hbc-stage {
    --mx: 50%; --my: 28%;
    position: relative; overflow: hidden; border-radius: 16px;
    padding: clamp(10px, 2.4vw, 28px);
    perspective: 1500px;
    background:
        radial-gradient(560px circle at var(--mx) var(--my), rgba(60, 140, 220, .30), transparent 62%),
        linear-gradient(160deg, #0a1b31 0%, #0c2747 55%, #071222 100%);
}
.hbc {
    --hbc-ink: #0a2540;          /* mực: chữ chính, nét khung */
    --hbc-blue: #1d5fa8;         /* xanh bản vẽ: nhấn mạnh, tên học viên */
    --hbc-muted: #5f7791;        /* nhãn phụ */
    --hbc-line: #b9d0e8;         /* nét mảnh */
    --hbc-paper: #f4f8fd;
    --hbc-orange: #ff7a1a;       /* điểm nhấn duy nhất */
    --rx: 0deg; --ry: 0deg; --px: 0; --py: 0;
    container-type: inline-size;
    /* Không cao hơn khung nhìn: bề ngang tối đa theo chiều cao còn lại của màn hình (tỉ lệ tờ 1,414) để thấy trọn tờ. */
    width: min(100%, 920px, calc((100dvh - 250px) * 1.414)); min-width: min(100%, 420px); margin: 0 auto;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transition: transform .5s cubic-bezier(.16, 1, .3, 1);
    will-change: transform;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
}

/* Vỏ ngoài (khay kính) ôm lõi giấy: hai lớp lồng nhau, bán kính đồng tâm */
.hbc-shell {
    padding: 1cqw; border-radius: 2.2cqw; aspect-ratio: 1.414 / 1;
    background: linear-gradient(150deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .07));
    border: 1px solid rgba(255, 255, 255, .26);
    box-shadow: 0 3.4cqw 6cqw -2.4cqw rgba(0, 0, 0, .65), inset 0 1px 0 rgba(255, 255, 255, .38);
    animation: hbcPop .9s cubic-bezier(.16, 1, .3, 1) both;
}
.hbc-paper {
    position: relative; height: 100%; overflow: hidden; border-radius: 1.2cqw;
    background:
        linear-gradient(rgba(29, 95, 168, .05) .12cqw, transparent .12cqw) 0 0 / 2.5cqw 2.5cqw,
        linear-gradient(90deg, rgba(29, 95, 168, .05) .12cqw, transparent .12cqw) 0 0 / 2.5cqw 2.5cqw,
        linear-gradient(rgba(29, 95, 168, .09) .14cqw, transparent .14cqw) 0 0 / 12.5cqw 12.5cqw,
        linear-gradient(90deg, rgba(29, 95, 168, .09) .14cqw, transparent .14cqw) 0 0 / 12.5cqw 12.5cqw,
        radial-gradient(120% 90% at 20% 0%, #ffffff 0%, var(--hbc-paper) 62%, #e9f1fa 100%);
    box-shadow: inset 0 1px 0 #fff;
}

/* Khung bản vẽ: nét đậm ngoài + nét mảnh trong, có đánh số vùng ở mép */
.hbc-frame { position: absolute; inset: 2.4cqw; border: .22cqw solid var(--hbc-ink); pointer-events: none; }
.hbc-frame::before { content: ''; position: absolute; inset: .5cqw; border: .1cqw solid var(--hbc-line); }
.hbc-zones { position: absolute; display: flex; justify-content: space-around; color: var(--hbc-muted); font: 700 max(6px, .85cqw)/1 ui-monospace, Consolas, monospace; pointer-events: none; }
.hbc-zones.top, .hbc-zones.bottom { left: 2.4cqw; right: 2.4cqw; height: 2.4cqw; align-items: center; }
.hbc-zones.top { top: 0; } .hbc-zones.bottom { bottom: 0; }
.hbc-zones.left, .hbc-zones.right { top: 2.4cqw; bottom: 2.4cqw; width: 2.4cqw; flex-direction: column; align-items: center; }
.hbc-zones.left { left: 0; } .hbc-zones.right { right: 0; }

/* Vệt sáng quét ngang theo con trỏ, chỉ dịch chuyển bằng transform */
.hbc-sheen {
    --sx: -40;
    position: absolute; top: 0; left: 0; width: 55cqw; height: 100%; z-index: 6; pointer-events: none; opacity: 0;
    background: linear-gradient(105deg, transparent 0%, rgba(255, 255, 255, .6) 50%, transparent 100%);
    mix-blend-mode: soft-light;
    transform: translate3d(calc(var(--sx) * 1cqw), 0, 0) skewX(-18deg);
    transition: opacity .35s ease;
}
.hbc-stage.is-live .hbc-sheen { opacity: 1; }

/* ---------- Bố cục: hàng trên (chữ | chi tiết) + hàng dưới (ô tiêu đề) ---------- */
.hbc-sheet {
    position: absolute; z-index: 2; inset: 5.4cqw 5.6cqw 5.2cqw;
    display: grid; grid-template-columns: minmax(0, 1fr) 27cqw; grid-template-rows: minmax(0, 1fr) auto; gap: 2.4cqw 3.6cqw;
}
.hbc-copy { display: flex; flex-direction: column; min-width: 0; }

.hbc-brand { display: flex; align-items: center; gap: 1.1cqw; }
.hbc-brand img { width: 3.7cqw; height: 3.7cqw; object-fit: contain; }
.hbc-brand b { display: block; font-size: max(9px, 1.45cqw); font-weight: 800; color: var(--hbc-ink); line-height: 1.15; }
.hbc-brand small { display: block; font-size: max(7px, 1.05cqw); color: var(--hbc-muted); line-height: 1.3; }

.hbc-title {
    margin: 2.4cqw 0 0; font-family: 'Bricolage Grotesque', 'Manrope', sans-serif; font-weight: 800;
    font-size: max(18px, 5.4cqw); line-height: 1; letter-spacing: -.035em; color: var(--hbc-ink); padding-bottom: .5cqw;
}
.hbc-title em { font-style: normal; color: var(--hbc-blue); }
.hbc-lead { margin: 1.8cqw 0 0; font-size: max(9px, 1.4cqw); color: var(--hbc-muted); }
.hbc-name {
    margin: .2cqw 0 0; font-family: 'Great Vibes', 'Brush Script MT', cursive; font-weight: 400;
    font-size: max(22px, var(--nf, 7.4cqw)); line-height: 1.16; color: var(--hbc-blue); overflow-wrap: anywhere;
}
.hbc-name::after { content: ''; display: block; width: 8cqw; height: .3cqw; margin-top: .5cqw; border-radius: 1cqw; background: var(--hbc-orange); }
.hbc-text { margin: 1.6cqw 0 0; font-size: max(9px, 1.5cqw); color: var(--hbc-ink); }
.hbc-course {
    margin: .6cqw 0 0; max-width: 94%; font-family: 'Bricolage Grotesque', 'Manrope', sans-serif; font-weight: 700;
    font-size: max(13px, 2.8cqw); line-height: 1.2; letter-spacing: -.015em; color: var(--hbc-ink);
}

/* ---------- Vòng chi tiết có linh vật ---------- */
.hbc-detail { position: relative; align-self: center; width: 100%; aspect-ratio: 1; }
/* Đường tâm nét đứt kéo dài ra ngoài vòng như bản vẽ kỹ thuật */
.hbc-detail::before, .hbc-detail::after { content: ''; position: absolute; pointer-events: none; opacity: .5; }
.hbc-detail::before { left: -2.4cqw; right: -2.4cqw; top: 50%; height: .1cqw; background: repeating-linear-gradient(90deg, var(--hbc-blue) 0 1.1cqw, transparent 1.1cqw 1.7cqw); }
.hbc-detail::after { top: -2.4cqw; bottom: -2.4cqw; left: 50%; width: .1cqw; background: repeating-linear-gradient(180deg, var(--hbc-blue) 0 1.1cqw, transparent 1.1cqw 1.7cqw); }
.hbc-disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #ffffff 0%, #dcebf9 62%, #c4dcf2 100%);
    border: .22cqw solid var(--hbc-ink);
    box-shadow: inset 0 0 0 .7cqw #f6faff, inset 0 0 0 .8cqw var(--hbc-line), 0 1.2cqw 2.2cqw -1.2cqw rgba(10, 37, 64, .35);
}
/* Vạch chia độ quanh vòng, mỗi 5 độ một vạch */
.hbc-disc::before {
    content: ''; position: absolute; inset: -1.5cqw; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, var(--hbc-ink) 0 .45deg, transparent .45deg 5deg);
    -webkit-mask-image: radial-gradient(circle, transparent 0, transparent 90%, #000 90.5%, #000 100%);
    mask-image: radial-gradient(circle, transparent 0, transparent 90%, #000 90.5%, #000 100%); opacity: .55;
}
/* Điểm mốc cam trên vòng */
.hbc-disc::after { content: ''; position: absolute; top: 14.6%; right: 14.6%; width: 1.5cqw; height: 1.5cqw; border-radius: 50%; background: var(--hbc-orange); border: .25cqw solid #fff; box-shadow: 0 0 0 .12cqw var(--hbc-ink); }
.hbc-mascot-wrap {
    position: absolute; z-index: 3; left: -.6cqw; bottom: -.9cqw; width: 28.2cqw; pointer-events: none;
    transition: transform .6s cubic-bezier(.16, 1, .3, 1);
    transform: translate3d(calc(var(--px) * -.9cqw), calc(var(--py) * -.6cqw), 0);
}
.hbc-mascot { display: block; width: 100%; height: auto; filter: drop-shadow(0 1.1cqw 1.4cqw rgba(10, 37, 64, .35)); animation: hbcBob 5.5s ease-in-out infinite; }

/* ---------- Ô tiêu đề (khung tên bản vẽ) ---------- */
.hbc-titleblock {
    grid-column: 1 / -1; display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.5fr 1.6fr;
    border: .2cqw solid var(--hbc-ink); background: rgba(255, 255, 255, .78);
}
.hbc-cell { min-width: 0; padding: 1.1cqw 1.5cqw; display: flex; flex-direction: column; justify-content: center; gap: .55cqw; border-left: .12cqw solid var(--hbc-ink); }
.hbc-cell:first-child { border-left: 0; }
.hbc-cell .hbc-k { font-size: max(6px, .9cqw); letter-spacing: .08em; text-transform: uppercase; color: var(--hbc-muted); font-weight: 700; }
.hbc-cell .hbc-v { margin: 0; font-size: max(9px, 1.45cqw); font-weight: 800; color: var(--hbc-ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hbc-cell.qr { flex-direction: row; align-items: center; gap: 1.3cqw; }
.hbc-qr, .hbc-qr-empty { width: 7.6cqw; height: 7.6cqw; flex: none; display: block; }
.hbc-qr { padding: .35cqw; background: #fff; border: .12cqw solid var(--hbc-line); border-radius: .6cqw; }
.hbc-cell.qr .hbc-v { font-size: max(8px, 1.15cqw); font-weight: 700; line-height: 1.3; color: var(--hbc-ink); }
.hbc-cell .hbc-sign-name { font-family: 'Great Vibes', 'Brush Script MT', cursive; font-size: max(14px, 3cqw); line-height: 1.05; font-weight: 400; color: var(--hbc-blue); white-space: nowrap; }
.hbc-cell .mark { display: inline-block; width: .9cqw; height: .9cqw; margin-right: .6cqw; background: var(--hbc-orange); vertical-align: .05cqw; }

.hbc-revoked {
    position: absolute; z-index: 7; top: 50%; left: 50%; pointer-events: none;
    transform: translate(-50%, -50%) rotate(-14deg);
    padding: .5cqw 2.4cqw; border: .5cqw solid #dc2626; border-radius: .9cqw; color: #dc2626;
    background: rgba(255, 255, 255, .6); font-size: max(14px, 4.4cqw); font-weight: 800; letter-spacing: .1em;
    opacity: .9; white-space: nowrap;
}
.hbc.revoked .hbc-paper { filter: grayscale(.75); }

/* Vào cảnh lệch pha 55ms giữa các phần tử */
.hbc [data-r] { animation: hbcRise .8s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 55ms + 140ms); }
@keyframes hbcPop { from { opacity: 0; transform: translate3d(0, 18px, 0) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes hbcRise { from { opacity: 0; transform: translate3d(0, 12px, 0); } to { opacity: 1; transform: none; } }
@keyframes hbcBob { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(0, -.7cqw, 0); } }

@media (prefers-reduced-motion: reduce) {
    .hbc, .hbc-sheen, .hbc-mascot-wrap { transition: none; }
    .hbc-shell, .hbc [data-r], .hbc-mascot { animation: none; }
}

@media print {
    .hbc-stage { padding: 0; overflow: visible; perspective: none; background: none !important; border-radius: 0; }
    /* 262mm: tờ cao 185mm, chừa dư vài mm so với vùng in 194mm của A4 ngang. Ở 270mm (191mm cao) Chrome vẫn sinh thêm một trang trống. */
    .hbc { width: 262mm; min-width: 0; transform: none !important; }
    .hbc-shell { background: none; border: .2mm solid #cfd8e3; box-shadow: none; animation: none; padding: 1cqw; }
    .hbc [data-r], .hbc-mascot { animation: none; }
    .hbc-mascot-wrap { transform: none !important; }
    .hbc-sheen { display: none; }

    /* In tờ chứng nhận: giấu toàn bộ trang phía sau (danh sách chứng nhận, thanh bên, thông báo...) và các hộp thoại
       khác, chỉ để lại thân hộp thoại chứng nhận: bản in phải đúng là thứ đang xem trên màn hình. */
    body.printing-cert .main,
    body.printing-cert .modal-mask:not(#modal-cert),
    body.printing-cert .skip-link,
    body.printing-cert #toast-box,
    body.printing-cert #global-loading-overlay { display: none !important; }
    html:has(body.printing-cert), body.printing-cert { height: auto !important; overflow: visible !important; background: #fff !important; }
    body.printing-cert #modal-cert { position: static !important; display: block !important; background: none !important; padding: 0 !important; overflow: visible !important; backdrop-filter: none !important; }
    body.printing-cert #modal-cert .modal { box-shadow: none !important; border: 0 !important; background: none !important; max-width: none !important; width: auto !important; max-height: none !important; }
    body.printing-cert #modal-cert .modal-body { padding: 0 !important; overflow: visible !important; max-height: none !important; }
    /* Hộp thoại có hiệu ứng mở (mờ dần + trượt): bộ dựng bản in không chạy hoạt ảnh, lấy luôn trạng thái đầu là trong suốt
       nên tờ chứng nhận ra trang trắng. Ép về trạng thái cuối. */
    body.printing-cert #modal-cert, body.printing-cert #modal-cert .modal, body.printing-cert #modal-cert .modal-body {
        animation: none !important; opacity: 1 !important; visibility: visible !important; transform: none !important;
    }
}
</style>
</head>

    <div class="content" id="content"></div>

<div class="modal-mask" id="modal-cert">

<!-- Thêm chứng nhận bên ngoài: bên trái là chỗ lấy tệp (chụp camera / tải PDF, ảnh), bên phải là thông tin giấy.
     Phần bên trái do JS dựng lại theo từng bước (đang ngắm -> đã chụp -> đã chọn tệp). Có tệp là AI đọc ngay
     (ô #ext-ai): điền sẵn thông tin, báo sớm chỗ chắc chắn không qua — xem startScan(). -->
<div class="modal-mask" id="modal-ext-add">
    <div class="modal wide">
        <form id="ext-form" novalidate>
            <div class="modal-head">
                <h3 data-i18n="certificate.extAddTitle">Thêm chứng nhận bên ngoài</h3>
                <button type="button" class="close-x" onclick="closeModal('modal-ext-add')">×</button>
            </div>
            <div class="modal-body ext-add-body">
                <div>
                    <div class="ext-mode" role="tablist">
                        <button type="button" role="tab" data-ext-mode="camera"><i class="ph ph-camera"></i> <span data-i18n="certificate.extModeCamera">Chụp bằng camera</span></button>
                        <button type="button" role="tab" data-ext-mode="file"><i class="ph ph-file-arrow-up"></i> <span data-i18n="certificate.extModeFile">Tải tệp PDF / ảnh</span></button>
                    </div>
                    <div id="ext-stage"></div>
                </div>
                <div>
                    <div class="ext-ai" id="ext-ai" aria-live="polite"></div>
                    <div class="field">
                        <label for="ext-title" data-i18n="certificate.extFieldTitle">Tên chứng nhận *</label>
                        <input id="ext-title" maxlength="250" required data-i18n-ph="certificate.extFieldTitlePh" placeholder="VD: An toàn lao động nhóm 3">
                    </div>
                    <div class="field">
                        <label for="ext-issuer" data-i18n="certificate.extFieldIssuer">Đơn vị cấp *</label>
                        <input id="ext-issuer" maxlength="250" required data-i18n-ph="certificate.extFieldIssuerPh" placeholder="VD: Trung tâm Huấn luyện ATLĐ">
                    </div>
                    <div class="field">
                        <label for="ext-no" data-i18n="certificate.extFieldNo">Số hiệu chứng nhận</label>
                        <input id="ext-no" maxlength="100" data-i18n-ph="certificate.extFieldNoPh" placeholder="Số in trên giấy (nếu có)">
                    </div>
                    <div class="row">
                        <div class="field" style="flex:1"><label for="ext-issued" data-i18n="certificate.extFieldIssued">Ngày cấp *</label><input type="date" id="ext-issued" required></div>
                        <div class="field" style="flex:1"><label for="ext-expired" data-i18n="certificate.extFieldExpired">Ngày hết hạn</label><input type="date" id="ext-expired"></div>
                    </div>
                    <div class="field">
                        <label for="ext-note" data-i18n="certificate.extFieldNote">Ghi chú</label>
                        <textarea id="ext-note" rows="2" maxlength="1000" data-i18n-ph="certificate.extFieldNotePh" placeholder="VD: Bản gốc đã nộp phòng Nhân sự"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn ghost" onclick="closeModal('modal-ext-add')" data-i18n="common.cancel">Hủy</button>
                <button type="submit" class="btn" id="ext-submit"><i class="ph ph-paper-plane-tilt"></i> <span data-i18n="certificate.extSubmit">Gửi xác nhận</span></button>
            </div>
        </form>
    </div>
</div>

<!-- Xem tệp quét của một chứng nhận bên ngoài kèm những gì AI đọc được; với Admin thì kèm nút sửa quyết định
     của AI (Xác nhận / Từ chối / Thu hồi). -->
<div class="modal-mask" id="modal-ext-view">
    <div class="modal wide">
        <div class="modal-head">
            <h3 data-i18n="certificate.extViewTitle">Chứng nhận bên ngoài</h3>
            <button type="button" class="close-x" onclick="closeModal('modal-ext-view')">×</button>
        </div>
        <div class="modal-body ext-view-body">
            <div class="ext-view-file" id="ext-view-file"></div>
            <div class="ext-view-info" id="ext-view-info"></div>
        </div>
        <div class="modal-foot" id="ext-view-foot"></div>
    </div>

<script src="/js/api.js"></script>
<script src="/js/language.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/password.js"></script>
<script src="/js/app.js"></script>
<script>
(async function () {
    // Chờ /locales/*.json tải xong rồi mới dựng giao diện — t() là hàm đồng bộ.
    await Lang.ready;

    if (!Auth.require()) return;
    mountLayout('certificate', t('index.stat-cert', 'Chứng nhận'), t('certificate.lichSuChungNhanHoanThanhDaoTao', 'Lịch sử chứng nhận hoàn thành đào tạo'));

    const content = document.getElementById('content');
    content.innerHTML = skeletonHtml('cards', { count: 6, thumb: false });

    // ----- Trạng thái của các thẻ chứng nhận bên ngoài / duyệt / in danh sách -----
    // Khai báo ở ĐÂY, trước lượt dựng trang bên dưới: các hàm dựng thẻ đọc chúng ngay trong lượt chạy đầu, mà
    // một "let" khai báo phía sau thì lúc đó vẫn nằm trong Temporal Dead Zone.
    /** Thẻ nào đã tải dữ liệu lần đầu — tải lười, chỉ khi người dùng mở thẻ. */
    const loadedTab = { external: false, review: false, register: false };
    let myExternalList = [];
    let reviewList = [];
    /** id -> ExternalCertificateDto, gom từ cả "của tôi" lẫn hàng duyệt, để nút Xem tìm lại được giấy. */
    const externalById = new Map();
    /** Toàn bộ phòng ban (bộ lọc của Admin) — khác departmentList bên dưới vốn chỉ là phòng ban cấp dưới. */
    let allDepartmentList = null;
    let registerRowList = [];
    /** Hộp thoại "Thêm chứng nhận": cách lấy tệp đang chọn, luồng camera, khung ngắm, ảnh đã chụp, tệp đã chọn. */
    let scanMode = 'camera';
    let cameraStream = null;
    let guideLandscape = true;
    let capturedCanvas = null;
    let enhanceCapture = false;
    let pickedFile = null;
    let pickedFileUrl = null;
    let viewFileUrl = null;
    /** AI đọc giấy trong hộp thoại "Thêm": tệp đang/đã được đọc — ĐÚNG dãy byte sẽ gửi đi, vì máy chủ nhận ra kết
     *  quả đọc sẵn theo dấu vân tay tệp —, bộ hủy lượt đọc đang chạy, trạng thái, và giá trị AI đã điền vào từng ô
     *  (ô nhân viên tự sửa thì lượt đọc sau không đè). */
    let scanFile = null;
    let scanSeq = 0;
    let scanController = null;
    let scanState = 'idle';
    let scanTimer = null;
    const aiFilledValue = {};
    /** Hẹn giờ tải lại danh sách "của tôi" khi còn giấy AI chưa đối chiếu xong. */
    let myRefreshTimer = null;
    /** Khớp với ExternalCertificateService (máy chủ còn kiểm lại theo chữ ký đầu tệp). */
    const acceptedTypeList = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'];
    const maxFileByte = 15 * 1024 * 1024;

    let list = [];
    let departmentList = [];
    let subordinateList = [];
    try {
        // Gọi song song: hai danh sách không phụ thuộc nhau, gọi nối tiếp thì trang chờ đúng hai vòng mạng.
        // Riêng nhánh cấp dưới tự nuốt lỗi và trả về mảng rỗng — vai trò không quản ai vẫn phải mở được
        // trang chứng nhận của chính mình, không thể để nó kéo cả trang xuống một màn hình báo lỗi.
        //
        // Bậc lọc thứ nhất (phòng ban) được tải TRƯỚC danh sách tên. Với Admin, tải tên ngay từ đầu nghĩa
        // là kéo về 100 cái tên rải khắp công ty mà người ta gần như chắc chắn sẽ lọc lại ngay sau đó.
        [list, departmentList] = await Promise.all([
            Auth.isManager ? API.get('/certificate') : API.get('/certificate/my'),
            API.getSilent('/certificate/subordinate-department').catch(() => [])
        ]);
    } catch (ex) {
        content.innerHTML = emptyHtml(ex.message, '<i class="ph ph-warning"></i>');
        return;
    }

    /** Chứng nhận đã tải về của từng người: userId -> mảng CertificateDto. Giữ lại để lần xổ thứ hai của
     *  cùng một người là tức thì — người quản lý hay đóng mở qua lại giữa vài nhân viên. */
    const certByUser = new Map();
    /** id chứng nhận -> DTO, để nút "Xem" trong khung xổ ra tìm lại được thẻ mà không phải dò từng mảng. */
    const certById = new Map();
    /** userId -> thông tin nhân viên. Tích lũy dần chứ không đọc thẳng từ subordinateList: danh sách đó bị
     *  thay mới sau mỗi lượt tìm kiếm, mà người đang được chọn có thể không còn khớp từ khóa mới — lúc đó
     *  dòng tên ở đầu khung kết quả sẽ trống trơn. */
    const personById = new Map();
    subordinateList.forEach(u => personById.set(u.userId, u));
    /** Nhân viên đang được chọn trên thanh tab, null = chưa chọn ai. */
    let selectedUserId = null;
    /** Phòng ban đang được chọn ở bậc lọc thứ nhất, null = chưa chọn. */
    let selectedDepartmentId = null;
    /** Toàn bộ người của phòng ban đang chọn (CHƯA lọc theo từ khóa) — dải số liệu tính trên danh sách này, để
     *  gõ tìm một cái tên không làm các con số tổng quan nhảy theo. */
    let deptPeopleList = [];
    /** Lọc nhanh danh sách bên trái: 'all' | 'has' (đã có chứng nhận) | 'none' (chưa có). */
    let peopleFilter = 'all';
    /** Bộ lọc của danh sách chứng nhận toàn công ty (Chuyên viên đào tạo, Giảng viên): phòng ban -> nhân viên
     *  -> từ khóa, lọc ngay trên trình duyệt vì cả danh sách đã nằm sẵn trong `list`. '' = không lọc. */
    const allCertFilter = { departmentKey: '', userId: '', keyword: '' };
    /** Phòng ban người xem đã tự bấm mở — mặc định thu gọn hết, và giữ nguyên lựa chọn qua các lượt vẽ lại. */
    const openDepartmentKey = new Set();
    /** Đúng một phòng ban thì bỏ hẳn bậc lọc đó đi — bắt người ta bấm một lựa chọn duy nhất là vô nghĩa. */
    const singleDepartment = departmentList.length === 1;
    /** Giá trị "Tất cả phòng ban" của bậc lọc thứ nhất (Admin / Tổng Giám Đốc nhìn nhiều phòng). Id phòng ban thật
     *  từ 1 trở lên, 0 là "Chưa gắn phòng ban" — nên -1 không đụng ai. */
    const ALL_DEPARTMENT = -1;
    // Cả danh sách chính cũng vào chung bộ nhớ đệm: nút "Xem chi tiết" giờ tra theo id chứng nhận chứ
    // không còn theo vị trí trong mảng — một chỉ số vốn sai ngay khi trang có thêm khối thứ hai cũng vẽ thẻ.
    list.forEach(c => certById.set(c.id, c));

    // Chỉ một phòng ban thì chọn sẵn và tải luôn danh sách tên, để Trưởng phòng / Giám Đốc thấy đúng thứ
    // họ vẫn thấy: bấm một cái là ra chứng nhận, không thêm bước nào.
    if (singleDepartment) {
        selectedDepartmentId = departmentList[0].departmentId;
        subordinateList = await API.getSilent(
            `/certificate/subordinate?departmentId=${selectedDepartmentId}`).catch(() => []);
        subordinateList.forEach(u => personById.set(u.userId, u));
        deptPeopleList = subordinateList;
    }

    // Có khối nhân viên cấp dưới thì bỏ hẳn danh sách "N chứng nhận đã được cấp" bên dưới: chứng nhận của
    // từng người đã xem được qua hai ô chọn ở trên, để thêm một danh sách dài nữa chỉ là lặp lại. Không có
    // khối đó (nhân viên thường) thì danh sách này là thứ DUY NHẤT trên trang, nên vẫn giữ.
    // Vai trò xem được chứng nhận CẢ công ty (Chuyên viên đào tạo...) thì danh sách đó gồm người của mọi phòng
    // ban — xếp theo phòng ban -> người và có bộ lọc, đổ phẳng ra thì không biết thẻ nào của ai.
    const internalHtml = departmentList.length ? subordinateSectionHtml()
        : (Auth.isManager && list.length) ? allCertSectionHtml() : (list.length ? `
        <div style="margin-bottom: 24px;">
            <h3 style="font-size: 20px; font-weight: 800; letter-spacing: -0.3px;">${list.length} chứng nhận đã được cấp</h3>
        </div>
        
        <div class="vip-cert-list">${list.map(vipCertItemHtml).join('')}</div>`
        : emptyHtml(t('certificate.banChuaCoChungNhanNaoHoanThanh', 'Bạn chưa có chứng nhận nào. Hoàn thành một khóa học để được cấp chứng nhận.'), '<i class="ph ph-seal-check"></i>'));

    // Toàn bộ phần chứng nhận nội bộ ở trên giờ là thẻ đầu tiên; các thẻ còn lại (bên ngoài, duyệt, in danh
    // sách) tải lười khi được mở — xem openCertTab().
    content.innerHTML = certTabsHtml(internalHtml);

    // Một handler ủy quyền cho CẢ trang, thay vì gắn vào từng nút ngay sau lượt vẽ đầu tiên. Thẻ chứng
    // nhận của nhân viên cấp dưới chỉ ra đời khi người ta bấm vào một cái tên — gắn theo kiểu
    // querySelectorAll lúc dựng trang thì mọi nút sinh ra sau đó không có handler nào cả.
    content.addEventListener('click', (e) => {
        const openBtn = e.target.closest('[data-cert-open]');
        if (!openBtn) return;
        const certificate = certById.get(+openBtn.dataset.certOpen);
        if (certificate) showCertificate(certificate);
    });

    bindSubordinateSection();
    bindAllCertSection();
    bindExternalFeature();
    bindCertTabs();

    // ==================== CHỨNG NHẬN TOÀN CÔNG TY (Chuyên viên đào tạo...) ====================

    /** Khóa nhóm phòng ban của một chứng nhận — DTO chỉ mang tên phòng ban, không mang id. Người chưa gắn
     *  phòng ban dồn vào một nhóm riêng có khóa '-', không bao giờ trùng tên phòng ban thật. */
    function departmentKeyOf(c) { return c.departmentName || '-'; }

    function departmentLabelOf(key) {
        return key === '-' ? t('certificate.regNoDepartment', 'Chưa gắn phòng ban') : key;
    }

    /** Phòng ban theo vần, nhóm "Chưa gắn phòng ban" luôn nằm cuối — đó là chỗ dồn sót, không phải nơi xem đầu tiên. */
    function compareDepartmentKey(a, b) {
        if (a === b) return 0;
        if (a === '-') return 1;
        if (b === '-') return -1;
        return a.localeCompare(b, 'vi');
    }

    /** Gom một danh sách chứng nhận thành phòng ban -> người -> chứng nhận (mới cấp trước). */
    function groupCertificate(certificateList) {
        const departmentMap = new Map();
        certificateList.forEach(c => {
            const key = departmentKeyOf(c);
            if (!departmentMap.has(key)) departmentMap.set(key, new Map());
            const personMap = departmentMap.get(key);
            if (!personMap.has(c.userId)) personMap.set(c.userId, []);
            personMap.get(c.userId).push(c);
        });

        return [...departmentMap.entries()]
            .sort(([a], [b]) => compareDepartmentKey(a, b))
            .map(([key, personMap]) => ({
                key,
                personList: [...personMap.values()]
                    .map(certList => certList.sort((a, b) => new Date(b.issuedAt) - new Date(a.issuedAt)))
                    .sort((a, b) => a[0].userFullName.localeCompare(b[0].userFullName, 'vi'))
            }));
    }

    function allCertSectionHtml() {
        return `
            <div class="card ac-tools">
                <div class="card-body register-filter-row">
                    <div class="field">
                        <label for="ac-dept">${esc(t('certificate.department', 'Phòng ban'))}</label>
                        <select id="ac-dept">${allCertDepartmentOptionHtml()}</select>
                    </div>
                    <div class="field">
                        <label for="ac-user">${esc(t('certificate.employee', 'Nhân viên'))}</label>
                        <select id="ac-user">${allCertPersonOptionHtml()}</select>
                    </div>
                    <div class="field grow">
                        <label for="ac-keyword">${esc(t('certificate.regSearch', 'Tìm kiếm'))}</label>
                        <input type="search" id="ac-keyword" autocomplete="off"
                               placeholder="${esc(t('certificate.searchPh', 'Tìm tên, mã NV, chứng nhận...'))}">
                    </div>
                </div>
            </div>
            <div class="ac-summary" id="ac-summary"></div>
            <div id="ac-body"></div>`;
    }

    function allCertDepartmentOptionHtml() {
        const countMap = new Map();
        list.forEach(c => countMap.set(departmentKeyOf(c), (countMap.get(departmentKeyOf(c)) || 0) + 1));
        return `<option value="">${esc(t('certificate.allDepartment', 'Mọi phòng ban'))}</option>`
            + [...countMap.keys()].sort(compareDepartmentKey).map(key => `
                <option value="${esc(key)}">${esc(departmentLabelOf(key))} (${countMap.get(key)})</option>`).join('');
    }

    /** Ô chọn nhân viên chỉ liệt kê người của phòng ban đang chọn — chọn phòng ban trước là thu hẹp luôn danh sách tên. */
    function allCertPersonOptionHtml() {
        const personMap = new Map();
        list.filter(c => !allCertFilter.departmentKey || departmentKeyOf(c) === allCertFilter.departmentKey)
            .forEach(c => {
                const person = personMap.get(c.userId) || { ...c, count: 0 };
                person.count++;
                personMap.set(c.userId, person);
            });
        return `<option value="">${esc(t('certificate.allEmployee', 'Mọi nhân viên'))}</option>`
            + [...personMap.values()]
                .sort((a, b) => a.userFullName.localeCompare(b.userFullName, 'vi'))
                .map(p => `<option value="${p.userId}">${esc(p.userFullName)} · ${esc(p.employeeCode)} (${p.count})</option>`).join('');
    }

    function filteredAllCert() {
        const keyword = normalizeForSearch(allCertFilter.keyword.trim());
        return list.filter(c =>
            (!allCertFilter.departmentKey || departmentKeyOf(c) === allCertFilter.departmentKey) &&
            (!allCertFilter.userId || c.userId === +allCertFilter.userId) &&
            (!keyword || normalizeForSearch([c.userFullName, c.employeeCode, c.courseTitle, c.courseCode, c.certificateNo]
                .filter(Boolean).join(' ')).includes(keyword)));
    }

    function renderAllCert() {
        const body = document.getElementById('ac-body');
        if (!body) return;

        const shownList = filteredAllCert();
        const groupList = groupCertificate(shownList);
        const personCount = groupList.reduce((sum, g) => sum + g.personList.length, 0);
        const isFiltered = !!(allCertFilter.departmentKey || allCertFilter.userId || allCertFilter.keyword.trim());

        document.getElementById('ac-summary').innerHTML = `
            <h3>${shownList.length} ${esc(t('certificate.issuedCount', 'chứng nhận đã được cấp'))}</h3>
            <span class="muted">${personCount} ${esc(t('certificate.peopleUnit', 'nhân viên'))} · ${groupList.length} ${esc(t('certificate.departmentUnit', 'phòng ban'))}</span>
            ${isFiltered ? `<button type="button" class="btn ghost sm" data-ac-clear><i class="ph ph-x"></i> ${esc(t('certificate.clearFilter', 'Xóa bộ lọc'))}</button>` : ''}`;

        if (!shownList.length) {
            body.innerHTML = emptyHtml(t('certificate.filterEmpty', 'Không có chứng nhận nào khớp bộ lọc.'), '<i class="ph ph-funnel"></i>');
            return;
        }

        const certUnit = esc(t('certificate.certUnit', 'chứng nhận'));
        // Đang lọc thì xổ sẵn mọi nhóm còn lại — lọc xong mà vẫn phải bấm mở từng phòng thì bộ lọc mất nửa tác dụng.
        body.innerHTML = groupList.map(group => `
            <details class="ac-dept" data-dept-key="${esc(group.key)}"${isFiltered || openDepartmentKey.has(group.key) ? ' open' : ''}>
                <summary class="ac-dept-head">
                    <span class="ac-dept-icon"><i class="ph ph-buildings"></i></span>
                    <h3>${esc(departmentLabelOf(group.key))}</h3>
                    <span class="muted">${group.personList.length} ${esc(t('certificate.peopleUnit', 'nhân viên'))} · ${group.personList.reduce((sum, p) => sum + p.length, 0)} ${certUnit}</span>
                    <span class="ac-dept-faces" aria-hidden="true">
                        ${group.personList.slice(0, 5).map(certList => personAvatarHtml(personOfCert(certList[0]))).join('')}
                        ${group.personList.length > 5 ? `<span class="avatar ac-more">+${group.personList.length - 5}</span>` : ''}
                    </span>
                    <i class="ph ph-caret-down ac-dept-caret"></i>
                </summary>
                <div class="ac-dept-body">
                ${group.personList.map(certList => {
                    const c = certList[0];
                    return `
                        <div class="ac-person">
                            <div class="ac-person-head">
                                ${personAvatarHtml(personOfCert(c))}
                                <div class="ac-person-text">
                                    <b>${esc(c.userFullName)}</b>
                                    <small>${esc(c.employeeCode)}${c.positionName ? ' · ' + esc(c.positionName) : ''}</small>
                                </div>
                                <span class="badge blue">${certList.length} ${certUnit}</span>
                            </div>
                            <div class="vip-cert-list">${certList.map(vipCertItemHtml).join('')}</div>
                        </div>`;
                }).join('')}
                </div>
            </details>`).join('');
    }

    /** Thông tin người nhận theo đúng dạng personAvatarHtml() cần. */
    function personOfCert(c) {
        return { fullName: c.userFullName, avatarUrl: c.userAvatarUrl };
    }

    function bindAllCertSection() {
        const body = document.getElementById('ac-body');
        if (!body) return;

        const departmentSelect = document.getElementById('ac-dept');
        const personSelect = document.getElementById('ac-user');
        const keywordInput = document.getElementById('ac-keyword');
        enhanceSearchableSelect(departmentSelect, { placeholder: t('certificate.searchDept', 'Tìm phòng ban...') });
        enhanceSearchableSelect(personSelect, { placeholder: t('certificate.searchEmployee', 'Tìm tên hoặc mã NV...') });

        /** Dựng lại ô chọn nhân viên theo phòng ban; người đang chọn không còn thuộc phòng đó thì bỏ chọn. */
        const refreshPersonSelect = () => {
            personSelect.innerHTML = allCertPersonOptionHtml();
            personSelect.value = [...personSelect.options].some(o => o.value === allCertFilter.userId) ? allCertFilter.userId : '';
            allCertFilter.userId = personSelect.value;
            enhanceSearchableSelect(personSelect);
        };

        departmentSelect.addEventListener('change', () => {
            allCertFilter.departmentKey = departmentSelect.value;
            refreshPersonSelect();
            renderAllCert();
        });
        personSelect.addEventListener('change', () => {
            allCertFilter.userId = personSelect.value;
            renderAllCert();
        });
        let timer;
        keywordInput.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => { allCertFilter.keyword = keywordInput.value; renderAllCert(); }, 200);
        });
        // Ghi nhớ theo CÚ BẤM chứ không theo sự kiện 'toggle': nhóm tự xổ ra lúc đang lọc cũng phát 'toggle', và
        // ghi cả chúng vào thì xóa bộ lọc xong mọi phòng vẫn mở. Lúc click, .open vẫn còn là trạng thái CŨ.
        body.addEventListener('click', (e) => {
            const details = e.target.closest('.ac-dept > summary')?.parentElement;
            if (!details) return;
            if (details.open) openDepartmentKey.delete(details.dataset.deptKey);
            else openDepartmentKey.add(details.dataset.deptKey);
        });
        document.getElementById('ac-summary').addEventListener('click', (e) => {
            if (!e.target.closest('[data-ac-clear]')) return;
            Object.assign(allCertFilter, { departmentKey: '', userId: '', keyword: '' });
            departmentSelect.value = '';
            enhanceSearchableSelect(departmentSelect);
            keywordInput.value = '';
            refreshPersonSelect();
            renderAllCert();
        });

        renderAllCert();
    }

    // ==================== CHỨNG NHẬN CỦA NHÂN VIÊN CẤP DƯỚI ====================

    function subordinateSectionHtml() {
        if (!departmentList.length) return '';

        return `
            <div class="card sub-box" id="sub-cert-box">
                <div class="sub-head">
                    <div class="sub-head-icon"><i class="ph ph-users-three"></i></div>
                    <div class="sub-head-text">

                        <p id="sub-head-note">${esc(headNoteText())}</p>
                    </div>

                        <div class="sub-dept">
                            <select id="dept-select" aria-label="Phòng ban">${departmentOptionListHtml()}</select>
                        </div>`}
                </div>
                <div class="ops-kpi sub-kpi" id="sub-kpi">${kpiHtml()}</div>
                <div class="sub-layout">
                    <aside class="sub-people" aria-label="Danh sách nhân viên">

    /** Dòng phụ dưới tiêu đề khối: đang xem phòng ban nào, bao nhiêu người. */
    function headNoteText() {
        const department = departmentList.find(d => d.departmentId === selectedDepartmentId);
        if (department) return `${department.name} · ${department.employeeCount} nhân viên`;
        const total = allDepartmentEmployeeCount();
        if (selectedDepartmentId === ALL_DEPARTMENT) return `Tất cả ${departmentList.length} phòng ban · ${total} nhân viên`;
        return `${departmentList.length} phòng ban · ${total} nhân viên — chọn một phòng ban để bắt đầu`;
    }

    function allDepartmentEmployeeCount() {
        return departmentList.reduce((sum, d) => sum + d.employeeCount, 0);
    }

    /** Tham số lọc phòng ban gửi lên máy chủ — "Tất cả phòng ban" thì không gửi gì. */
    function departmentQuery(departmentId) {
        return departmentId === ALL_DEPARTMENT ? '' : `departmentId=${departmentId}`;
    }

    /** Dải ba con số của phòng ban đang chọn. Chưa chọn phòng ban thì hiện gạch ngang thay vì số 0 — số 0 nói
     *  "phòng này không ai có chứng nhận", điều không hề đúng. */
    function kpiHtml() {
        const ready = singleDepartment || selectedDepartmentId !== null;
        const department = selectedDepartmentId === ALL_DEPARTMENT
            ? { employeeCount: allDepartmentEmployeeCount() }
            : departmentList.find(d => d.departmentId === selectedDepartmentId);
        const total = deptPeopleList.length;
        const withCert = deptPeopleList.filter(u => u.certificateCount > 0).length;
        const percent = total ? Math.round(withCert / total * 100) : 0;

        const cell = (i, tone, icon, label, value, foot) => `
            <div class="ops-kpi-cell" style="--i:${i}; --tone:${tone}">
                <div class="ops-kpi-top"><span class="ops-kpi-label">${label}</span><span class="ops-kpi-icon"><i class="ph ${icon}"></i></span></div>
                <div class="ops-kpi-value">${ready ? value : '—'}</div>
                <div class="ops-kpi-foot">${ready ? foot : '&nbsp;'}</div>
            </div>`;

        return cell(0, 'var(--primary)', 'ph-users', 'Nhân viên', total,
                // Máy chủ trả tối đa 100 người một lượt — nói rõ khi phòng đông hơn thế, kẻo người xem tưởng thiếu người.
                department && department.employeeCount > total ? `Hiện ${total}/${department.employeeCount} người — gõ tên để tìm`
                    : selectedDepartmentId === ALL_DEPARTMENT ? 'Toàn công ty' : 'Trong phòng ban')
            + cell(1, 'var(--success)', 'ph-seal-check', 'Đã có chứng nhận', withCert, `${percent}% nhân viên`)
            + cell(2, 'var(--warning)', 'ph-hourglass-medium', 'Chưa có chứng nhận', total - withCert, 'Chưa hoàn thành khóa nào');
    }

    function refreshSummary() {
        const note = document.getElementById('sub-head-note');
        const kpi = document.getElementById('sub-kpi');
        if (note) note.textContent = headNoteText();
        if (kpi) kpi.innerHTML = kpiHtml();
    }

    /** Ảnh đại diện, hoặc chữ cái đầu của tên khi chưa có ảnh. */
    function personAvatarHtml(person) {
        return person?.avatarUrl
            ? `<img class="avatar" src="${esc(person.avatarUrl)}" alt="">`
            : `<span class="avatar" aria-hidden="true">${esc(initial(person?.fullName))}</span>`;
    }

    function emptyBlockHtml(icon, title, text) {
        return `
            <div class="sub-empty">
                <div class="sub-empty-icon"><i class="ph ${icon}"></i></div>
                <h4>${esc(title)}</h4>
                <p>${esc(text)}</p>
            </div>`;
    }

    function departmentOptionListHtml() {
        return '<option value="">— Chọn phòng ban —</option>'
            + `<option value="${ALL_DEPARTMENT}">Tất cả phòng ban (${allDepartmentEmployeeCount()} người)</option>`
            + departmentList.map(d => `
                <option value="${d.departmentId}">${esc(d.name)} (${d.employeeCount} người)</option>`).join('');
    }

    /** Hàm KHAI BÁO chứ không phải const-mũi-tên: subordinateSectionHtml() gọi nó ngay lúc dựng trang, mà
     *  chỗ dựng đó chạy TRƯỚC dòng này. Một const ở đây còn nằm trong vùng chết tạm thời tại thời điểm ấy,
     *  và cả trang vỡ bằng ReferenceError với bất kỳ ai có cấp dưới. */
    /** Một thẻ chứng nhận kiểu "vàng kim" — mẫu dùng CHUNG cho danh sách chứng nhận của chính mình và cho
     *  khung xổ ra của nhân viên cấp dưới. Hai chỗ cùng vẽ một thứ thì phải cùng một hàm: chép ra hai bản
     *  là lần sau sửa thẻ ở chỗ này mà quên chỗ kia, rồi hai khối trên cùng một trang lại trông khác nhau.
     *
     *  Hàm KHAI BÁO chứ không phải const — nó được gọi ngay lúc dựng trang, ở đoạn chạy TRƯỚC dòng này. */
    function vipCertItemHtml(c) {
        return `
            <div class="cert-card interactive vip-cert-item ${c.isRevoked ? 'revoked' : ''}">
                <span class="cert-card-shine"></span>
                <i class="ph-fill ph-seal-check cert-card-stamp"></i>

                <div class="vip-cert-main">
                    <div class="cert-card-no">
                        <i class="ph-fill ph-medal"></i> ${esc(c.certificateNo)}
                    </div>
                    <div class="vip-cert-user">

                    </div>

                <div class="vip-cert-meta">

                    <div><span class="muted">Cấp ngày:</span> <b>${formatDate(c.issuedAt)}</b></div>
                    <div>
                        ${c.isRevoked
                            ? '<span data-i18n="account.daThuHoi" class="badge red">Đã thu hồi</span>'
                            : (c.expiredAt && new Date(c.expiredAt) < new Date())
                                ? '<span data-i18n="certificate.hetHan" class="badge orange">Hết hạn</span>'
                                : `<span data-i18n="certificate.conHieuLuc" class="badge green">Còn hiệu lực</span> <span class="small muted">đến ${formatDate(c.expiredAt)}</span>`}
