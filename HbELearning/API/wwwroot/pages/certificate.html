<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: máy có tai thỏ thì trang phủ kín màn hình, phần né tai thỏ do CSS lo bằng env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Màu thanh trạng thái, biểu tượng, manifest và service worker — xem js/head.js. Nạp đồng bộ và
         đứng trước <title> để các thẻ đó có mặt trước khi trang bắt đầu vẽ. -->
    <script src="/js/head.js"></script>
    <title data-i18n="certificate.chungNhanHbELearning">Chứng nhận · HB E-Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <script>(function(){var t=localStorage.getItem('hbe_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>

    <style>
/* ================= DANH SÁCH CHỨNG NHẬN VIP ================= */
.vip-cert-list { 
    display: flex; 
    flex-direction: column; 
    gap: 16px; 
}

/* Mặt thẻ, vệt sáng, con dấu chìm và số hiệu lấy từ .cert-card trong css/style.css — ở đây chỉ đặt tông
   màu vàng kim và bố cục hàng ngang ba khối (thông tin / chỉ số / nút). */
.vip-cert-item {
    --cert-tint: #fde68a;
    --cert-glow: rgba(245, 158, 11, .15);
    --cert-glow-strong: rgba(245, 158, 11, .4);
    --cert-shine: rgba(255, 215, 0, .3);
    --cert-ink: #b45309;
    display: flex; align-items: center; gap: 24px; padding: 20px 24px;
}
.vip-cert-item:hover { border-color: #fbbf24; }

/* Con dấu ở đây nằm giữa thẻ và thở nhẹ theo nhịp, khác thẻ thu gọn ở trang tài khoản (nép vào góc). */
.vip-cert-item .cert-card-stamp {
    right: 20%; top: 50%; font-size: 160px; opacity: .06; color: #d97706;
    animation: vipStampPulse 4s alternate infinite ease-in-out;
}
@keyframes vipStampPulse {
    from { transform: translateY(-50%) scale(1); opacity: .06; }
    to   { transform: translateY(-50%) scale(1.1); opacity: .12; }
}

/* Bố cục nội dung thẻ */
.vip-cert-main { flex: 2; min-width: 0; }
.vip-cert-item .cert-card-no { font-size: 15px; }
.vip-cert-item .cert-card-no i { color: #eab308; font-size: 18px; filter: drop-shadow(0 2px 4px rgba(234, 179, 8, .4)); }
.vip-cert-user { font-size: 15px; margin-bottom: 4px; color: var(--text); }
.vip-cert-user span { font-size: 12.5px; color: var(--text-muted); font-weight: normal; margin-left: 8px; }
.vip-cert-course { font-size: 17px; }

.vip-cert-meta { 
    flex: 1; display: flex; flex-direction: column; gap: 8px; 
    font-size: 13px; border-left: 1px dashed #fbbf24; padding-left: 20px; 
}
.vip-cert-meta b { color: var(--text); }
.vip-cert-score b { font-size: 18px; color: var(--primary); font-family: "Consolas", monospace; }

.vip-cert-actions { 
    flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; 
    border-left: 1px dashed #fbbf24; padding-left: 20px; z-index: 3; 
}
.vip-cert-actions .btn { width: 110px; justify-content: center; }

/* Trạng thái bị thu hồi */
.vip-cert-item.revoked { border-color: var(--danger); box-shadow: 0 4px 20px -5px rgba(220, 38, 38, 0.15); }
.vip-cert-item.revoked:hover { box-shadow: 0 15px 35px -5px rgba(220, 38, 38, 0.4); border-color: var(--danger); }
.vip-cert-item.revoked { --cert-shine: rgba(220, 38, 38, .2); --cert-ink: #991b1b; }
.vip-cert-item.revoked .cert-card-stamp { color: var(--danger); }
.vip-cert-item.revoked .cert-card-no i { color: #f87171; }
.vip-cert-item.revoked .vip-cert-meta, .vip-cert-item.revoked .vip-cert-actions { border-left-color: var(--danger); }

/* ================= CHỨNG NHẬN CỦA NHÂN VIÊN CẤP DƯỚI =================
   Danh sách xếp gọn: mỗi người một dòng, bấm vào tên thì xổ chứng nhận của người đó ra ngay bên dưới.
   Cố ý KHÔNG đẩy sang một trang riêng — người quản lý thường rà vài người liền nhau, mà mỗi lượt rà đi
   kèm một lần tải trang thì họ mất chỗ đang đứng sau mỗi người. */
.sub-cert-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.sub-cert-head .body { flex: 1; min-width: 200px; }
.sub-cert-head h3 { font-size: 16px; font-weight: 700; }
.sub-cert-head small { color: var(--text-muted); font-size: 12.5px; }

.sub-cert-search { position: relative; flex-shrink: 0; }
.sub-cert-search i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.sub-cert-search input {
    width: 260px; max-width: 100%; padding: 8px 12px 8px 32px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-size: 13px;
}
.sub-cert-search input:focus { outline: none; border-color: var(--primary); }

.sub-cert-body { padding: 16px 20px 20px; }

/* Hai ô chọn đặt cạnh nhau: Phòng ban bên trái, Nhân viên bên phải — đọc từ trái sang là đúng thứ tự
   phải chọn. Trước đây là hai dải viên thuốc cuộn ngang; một phòng ban vài chục người thì cái tên cần tìm
   nằm khuất ngoài mép phải, phải cuộn mò. Ô chọn có sẵn ô gõ để tìm (enhanceSearchableSelect trong app.js)
   nên gõ vài chữ là ra, dù danh sách dài bao nhiêu. */
.sub-filter-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px 16px; margin-bottom: 14px;
}
/* Chỉ quản lý một phòng ban thì không có ô Phòng ban — ô Nhân viên không cần giãn hết bề ngang. */
.sub-filter-grid.single { grid-template-columns: minmax(0, 1fr); max-width: 420px; }
.sub-filter > label {
    display: block; margin-bottom: 6px;
    font-size: 12px; font-weight: 600; color: var(--text-muted);
}

@media (max-width: 640px) {
    .sub-filter-grid { grid-template-columns: minmax(0, 1fr); }
}

/* Đầu khung kết quả: luôn nói rõ ĐANG xem chứng nhận của ai — ô chọn chỉ hiện một dòng tên, thiếu mã
   nhân viên và chức danh để phân biệt hai người trùng tên. */
.sub-panel-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px dashed var(--border);
}
.sub-panel-head b { font-size: 15px; }
.sub-panel-head small { font-size: 12px; color: var(--text-muted); }


.sub-note { padding: 10px 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); }

@media (max-width: 640px) {
    .sub-cert-body { padding: 12px 14px 16px; }
}

/* Responsive cho điện thoại */
@media (max-width: 820px) {
    .vip-cert-item { flex-direction: column; align-items: stretch; gap: 16px; padding: 16px; }
    .vip-cert-meta, .vip-cert-actions { border-left: none; border-top: 1px dashed #fbbf24; padding-left: 0; padding-top: 16px; }
    .vip-cert-actions { flex-direction: row; }
    .vip-cert-actions .btn { flex: 1; }
}
</style>
</head>
<body>
<div class="main">
    <div class="content" id="content"></div>
</div>

<div class="modal-mask" id="modal-cert">
    <div class="modal wide">
        <div class="modal-head">
            <h3 data-i18n="certificate.chungNhanHoanThanh">Chứng nhận hoàn thành</h3>
            <button class="close-x" onclick="closeModal('modal-cert')">×</button>
        </div>
        <div class="modal-body" id="cert-view"></div>
        <div class="modal-foot no-print">
            <button data-i18n="common.close" class="btn ghost" onclick="closeModal('modal-cert')">Đóng</button>
            <button class="btn" onclick="window.print()"><i class="ph ph-printer"></i> <span data-i18n="certificate.inLuuPdf">In / Lưu PDF</span></button>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/language.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/password.js"></script>
<script src="/js/app.js"></script>
<script>
(async function () {
    // Chờ /locales/*.json tải xong rồi mới dựng giao diện — t() là hàm đồng bộ.
    await Lang.ready;

    if (!Auth.require()) return;
    mountLayout('certificate', t('index.stat-cert', 'Chứng nhận'), t('certificate.lichSuChungNhanHoanThanhDaoTao', 'Lịch sử chứng nhận hoàn thành đào tạo'));

    const content = document.getElementById('content');
    content.innerHTML = skeletonHtml('cards', { count: 6, thumb: false });

    let list = [];
    let departmentList = [];
    let subordinateList = [];
    try {
        // Gọi song song: hai danh sách không phụ thuộc nhau, gọi nối tiếp thì trang chờ đúng hai vòng mạng.
        // Riêng nhánh cấp dưới tự nuốt lỗi và trả về mảng rỗng — vai trò không quản ai vẫn phải mở được
        // trang chứng nhận của chính mình, không thể để nó kéo cả trang xuống một màn hình báo lỗi.
        //
        // Bậc lọc thứ nhất (phòng ban) được tải TRƯỚC danh sách tên. Với Admin, tải tên ngay từ đầu nghĩa
        // là kéo về 100 cái tên rải khắp công ty mà người ta gần như chắc chắn sẽ lọc lại ngay sau đó.
        [list, departmentList] = await Promise.all([
            Auth.isManager ? API.get('/certificate') : API.get('/certificate/my'),
            API.getSilent('/certificate/subordinate-department').catch(() => [])
        ]);
    } catch (ex) {
        content.innerHTML = emptyHtml(ex.message, '<i class="ph ph-warning"></i>');
        return;
    }

    /** Chứng nhận đã tải về của từng người: userId -> mảng CertificateDto. Giữ lại để lần xổ thứ hai của
     *  cùng một người là tức thì — người quản lý hay đóng mở qua lại giữa vài nhân viên. */
    const certByUser = new Map();
    /** id chứng nhận -> DTO, để nút "Xem" trong khung xổ ra tìm lại được thẻ mà không phải dò từng mảng. */
    const certById = new Map();
    /** userId -> thông tin nhân viên. Tích lũy dần chứ không đọc thẳng từ subordinateList: danh sách đó bị
     *  thay mới sau mỗi lượt tìm kiếm, mà người đang được chọn có thể không còn khớp từ khóa mới — lúc đó
     *  dòng tên ở đầu khung kết quả sẽ trống trơn. */
    const personById = new Map();
    subordinateList.forEach(u => personById.set(u.userId, u));
    /** Nhân viên đang được chọn trên thanh tab, null = chưa chọn ai. */
    let selectedUserId = null;
    /** Phòng ban đang được chọn ở bậc lọc thứ nhất, null = chưa chọn. */
    let selectedDepartmentId = null;
    /** Đúng một phòng ban thì bỏ hẳn bậc lọc đó đi — bắt người ta bấm một lựa chọn duy nhất là vô nghĩa. */
    const singleDepartment = departmentList.length === 1;
    // Cả danh sách chính cũng vào chung bộ nhớ đệm: nút "Xem chi tiết" giờ tra theo id chứng nhận chứ
    // không còn theo vị trí trong mảng — một chỉ số vốn sai ngay khi trang có thêm khối thứ hai cũng vẽ thẻ.
    list.forEach(c => certById.set(c.id, c));

    // Chỉ một phòng ban thì chọn sẵn và tải luôn danh sách tên, để Trưởng phòng / Giám Đốc thấy đúng thứ
    // họ vẫn thấy: bấm một cái là ra chứng nhận, không thêm bước nào.
    if (singleDepartment) {
        selectedDepartmentId = departmentList[0].departmentId;
        subordinateList = await API.getSilent(
            `/certificate/subordinate?departmentId=${selectedDepartmentId}`).catch(() => []);
        subordinateList.forEach(u => personById.set(u.userId, u));
    }

    // Có khối nhân viên cấp dưới thì bỏ hẳn danh sách "N chứng nhận đã được cấp" bên dưới: chứng nhận của
    // từng người đã xem được qua hai ô chọn ở trên, để thêm một danh sách dài nữa chỉ là lặp lại. Không có
    // khối đó (nhân viên thường) thì danh sách này là thứ DUY NHẤT trên trang, nên vẫn giữ.
    content.innerHTML = departmentList.length ? subordinateSectionHtml() : (list.length ? `
        <div style="margin-bottom: 24px;">
            <h3 style="font-size: 20px; font-weight: 800; letter-spacing: -0.3px;">${list.length} chứng nhận đã được cấp</h3>
        </div>
        
        <div class="vip-cert-list">${list.map(vipCertItemHtml).join('')}</div>`
        : emptyHtml(t('certificate.banChuaCoChungNhanNaoHoanThanh', 'Bạn chưa có chứng nhận nào. Hoàn thành một khóa học để được cấp chứng nhận.'), '<i class="ph ph-seal-check"></i>'));

    // Một handler ủy quyền cho CẢ trang, thay vì gắn vào từng nút ngay sau lượt vẽ đầu tiên. Thẻ chứng
    // nhận của nhân viên cấp dưới chỉ ra đời khi người ta bấm vào một cái tên — gắn theo kiểu
    // querySelectorAll lúc dựng trang thì mọi nút sinh ra sau đó không có handler nào cả.
    content.addEventListener('click', (e) => {
        const openBtn = e.target.closest('[data-cert-open]');
        if (!openBtn) return;
        const certificate = certById.get(+openBtn.dataset.certOpen);
        if (certificate) showCertificate(certificate);
    });

    bindSubordinateSection();

    // ==================== CHỨNG NHẬN CỦA NHÂN VIÊN CẤP DƯỚI ====================

    function subordinateSectionHtml() {
        if (!departmentList.length) return '';

        const total = departmentList.reduce((sum, d) => sum + d.employeeCount, 0);

        return `
            <div class="card" id="sub-cert-box">
                <div class="card-head sub-cert-head">
                    <div class="body">
                        <h3><i class="ph ph-users-three"></i> Chứng nhận của nhân viên cấp dưới</h3>
                        <small>${total} người thuộc phạm vi quản lý của bạn${singleDepartment
                            ? ' — chọn một nhân viên để xem chứng nhận.'
                            : ` ở ${departmentList.length} phòng ban — chọn phòng ban rồi chọn nhân viên.`}</small>
                    </div>
                    <div class="sub-cert-search">
                        <i class="ph ph-magnifying-glass"></i>
                        <input id="sub-search" type="search" autocomplete="off" placeholder="Tìm theo tên hoặc mã nhân viên...">
                    </div>
                </div>
                <div class="sub-cert-body">
                    <div class="sub-filter-grid${singleDepartment ? ' single' : ''}">
                        ${singleDepartment ? '' : `
                            <div class="sub-filter">
                                <label for="dept-select">Phòng ban</label>
                                <select id="dept-select">${departmentOptionListHtml()}</select>
                            </div>`}
                        <div class="sub-filter">
                            <label for="sub-select">Nhân viên</label>
                            <select id="sub-select"></select>
                        </div>
                    </div>
                    <div id="sub-cert-panel">${panelHintHtml()}</div>
                </div>
            </div>`;
    }

    function departmentOptionListHtml() {
        return '<option value="">— Chọn phòng ban —</option>'
            + departmentList.map(d => `
                <option value="${d.departmentId}">${esc(d.name)} (${d.employeeCount} người)</option>`).join('');
    }

    /** Hàm KHAI BÁO chứ không phải const-mũi-tên: subordinateSectionHtml() gọi nó ngay lúc dựng trang, mà
     *  chỗ dựng đó chạy TRƯỚC dòng này. Một const ở đây còn nằm trong vùng chết tạm thời tại thời điểm ấy,
     *  và cả trang vỡ bằng ReferenceError với bất kỳ ai có cấp dưới. */
    /** Một thẻ chứng nhận kiểu "vàng kim" — mẫu dùng CHUNG cho danh sách chứng nhận của chính mình và cho
     *  khung xổ ra của nhân viên cấp dưới. Hai chỗ cùng vẽ một thứ thì phải cùng một hàm: chép ra hai bản
     *  là lần sau sửa thẻ ở chỗ này mà quên chỗ kia, rồi hai khối trên cùng một trang lại trông khác nhau.
     *
     *  Hàm KHAI BÁO chứ không phải const — nó được gọi ngay lúc dựng trang, ở đoạn chạy TRƯỚC dòng này. */
    function vipCertItemHtml(c) {
        return `
            <div class="cert-card interactive vip-cert-item ${c.isRevoked ? 'revoked' : ''}">
                <span class="cert-card-shine"></span>
                <i class="ph-fill ph-seal-check cert-card-stamp"></i>

                <div class="vip-cert-main">
                    <div class="cert-card-no">
                        <i class="ph-fill ph-medal"></i> ${esc(c.certificateNo)}
                    </div>
                    <div class="vip-cert-user">
                        <b>${esc(c.userFullName)}</b>
                        <span>${esc(c.employeeCode)}${c.departmentName ? ' · ' + esc(c.departmentName) : ''}</span>
                    </div>
                    <div class="cert-card-course vip-cert-course">
                        ${esc(c.courseTitle)}
                        <span class="small muted" style="font-family: sans-serif; font-weight: 500;">${esc(c.courseCode)}</span>
                    </div>
                </div>

                <div class="vip-cert-meta">
                    <div class="vip-cert-score"><span class="muted">Đánh giá:</span> <b>${c.finalScore}</b><small class="muted">/100</small></div>
                    <div><span class="muted">Cấp ngày:</span> <b>${formatDate(c.issuedAt)}</b></div>
                    <div>
                        ${c.isRevoked
                            ? '<span data-i18n="account.daThuHoi" class="badge red">Đã thu hồi</span>'
                            : (c.expiredAt && new Date(c.expiredAt) < new Date())
                                ? '<span data-i18n="certificate.hetHan" class="badge orange">Hết hạn</span>'
                                : `<span data-i18n="certificate.conHieuLuc" class="badge green">Còn hiệu lực</span> <span class="small muted">đến ${formatDate(c.expiredAt)}</span>`}
                    </div>
                </div>

                <div class="vip-cert-actions">
                    <button type="button" class="btn ghost sm" data-cert-open="${c.id}">Xem chi tiết</button>
                    <a data-i18n="certificate.xacThuc" class="btn ghost sm" href="/pages/verify.html?code=${encodeURIComponent(c.certificateNo)}" target="_blank">Xác thực</a>
                </div>
            </div>`;
    }

    function panelHintHtml() {
        const text = (!singleDepartment && selectedDepartmentId === null)
            ? 'Chọn một phòng ban, rồi chọn nhân viên để xem chứng nhận.'
            : 'Chọn một nhân viên để xem chứng nhận của người đó.';
        return `<div class="sub-note" style="padding-left:0">${text}</div>`;
    }

    /** Vẽ lại ô chọn Nhân viên theo trạng thái hiện tại.
     *  @param {string} [message] thay cả danh sách bằng một dòng thông báo (đang tải / lỗi) và khóa ô lại. */
    function renderSubordinateSelect(message) {
        const select = document.getElementById('sub-select');
        if (!select) return;

        const needDepartment = !singleDepartment && selectedDepartmentId === null;
        const note = message
            || (needDepartment ? '— Chọn phòng ban trước —'
            : !subordinateList.length
                ? (document.getElementById('sub-search')?.value.trim()
                    ? 'Không có nhân viên nào khớp từ khóa' : 'Phòng ban này chưa có nhân viên')
            : null);

        // Người đang chọn có thể không còn trong danh sách mới (VD vừa gõ tìm người khác). Vẫn giữ họ làm
        // một dòng riêng ở đầu, nếu không ô chọn nhảy về trống trong khi khung bên dưới vẫn đang hiện
        // chứng nhận của họ — hai thứ nói hai điều khác nhau.
        const keepSelected = selectedUserId !== null && !subordinateList.some(u => u.userId === selectedUserId)
            ? personById.get(selectedUserId) : null;
        const peopleList = keepSelected ? [keepSelected, ...subordinateList] : subordinateList;

        select.innerHTML = note && !keepSelected
            ? `<option value="">${esc(note)}</option>`
            : '<option value="">— Chọn nhân viên —</option>'
                + peopleList.map(u => `
                    <option value="${u.userId}">${esc(u.fullName)} · ${esc(u.employeeCode)} (${u.certificateCount} chứng nhận)</option>`).join('');
        select.value = selectedUserId ?? '';
        select.disabled = !!message || needDepartment || (!subordinateList.length && !keepSelected);
        enhanceSearchableSelect(select, { placeholder: 'Tìm tên hoặc mã nhân viên...' });
    }

    /** Một chỗ gắn sự kiện cho cả khối, thay vì gắn lại cho từng dòng sau mỗi lượt tìm kiếm: danh sách được
     *  vẽ lại liên tục, mà handler gắn vào dòng cũ thì mất theo dòng đó. */
    function bindSubordinateSection() {
        const box = document.getElementById('sub-cert-box');
        if (!box) return;

        // CHỈ lo việc chọn tên. Nút "Xem chi tiết" trên từng thẻ do handler ủy quyền ở cấp #content lo —
        // khối này nằm TRONG #content nên bắt thêm ở đây là hộp thoại chứng nhận mở hai lần một lúc.
        const departmentSelect = document.getElementById('dept-select');
        if (departmentSelect) {
            enhanceSearchableSelect(departmentSelect, { placeholder: 'Tìm phòng ban...' });
            departmentSelect.addEventListener('change', () => {
                if (departmentSelect.value) selectDepartment(+departmentSelect.value);
            });
        }

        document.getElementById('sub-select').addEventListener('change', (e) => {
            if (e.target.value) selectSubordinate(+e.target.value);
        });
        renderSubordinateSelect();

        let timer;
        document.getElementById('sub-search').addEventListener('input', (e) => {
            clearTimeout(timer);
            const keyword = e.target.value.trim();
            // Gõ xong 300ms mới gọi API, không phải mỗi phím một request.
            timer = setTimeout(async () => {
                // Tìm kiếm chạy TRONG phòng ban đang chọn. Bỏ qua điều đó thì gõ một cái tên phổ biến là
                // kết quả nhảy ra người của phòng khác, mâu thuẫn với cái tab phòng ban đang sáng ngay trên.
                if (!singleDepartment && selectedDepartmentId === null) return;
                try {
                    subordinateList = await API.getSilent(
                        `/certificate/subordinate?departmentId=${selectedDepartmentId}`
                        + `&keyword=${encodeURIComponent(keyword)}`);
                } catch { return; }
                subordinateList.forEach(u => personById.set(u.userId, u));
                renderSubordinateSelect();
                // CỐ Ý giữ nguyên khung kết quả bên dưới: người đang xem chứng nhận của một nhân viên rồi
                // mới gõ tìm người tiếp theo thì xóa trắng nó đi là cướp mất thứ họ đang đọc dở. Dòng tên
                // ở đầu khung vẫn cho biết đó là chứng nhận của ai.
            }, 300);
        });
    }

    async function selectDepartment(departmentId) {
        if (departmentId === selectedDepartmentId) return;

        selectedDepartmentId = departmentId;
        selectedUserId = null;

        // Đổi phòng ban thì người đang xem dở không còn thuộc phạm vi đang lọc nữa — trả khung kết quả về
        // lời gợi ý, đừng để chứng nhận của một người phòng khác nằm dưới một phòng ban vừa đổi.
        const panel = document.getElementById('sub-cert-panel');
        panel.innerHTML = panelHintHtml();
        document.getElementById('sub-search').value = '';

        renderSubordinateSelect('Đang tải danh sách nhân viên...');

        try {
            subordinateList = await API.getSilent(`/certificate/subordinate?departmentId=${departmentId}`);
        } catch (ex) {
            if (selectedDepartmentId === departmentId) renderSubordinateSelect(ex.message);
            return;
        }

        // Chọn nhanh sang phòng ban khác trong lúc request còn chạy thì kết quả về muộn này đã lỗi thời.
        if (selectedDepartmentId !== departmentId) return;

        subordinateList.forEach(u => personById.set(u.userId, u));
        renderSubordinateSelect();
    }

    async function selectSubordinate(userId) {
        selectedUserId = userId;

        const panel = document.getElementById('sub-cert-panel');
        const person = personById.get(userId);

        if (!certByUser.has(userId)) {
            panel.innerHTML = skeletonHtml('list', { count: 2, avatar: false });
            let certificateList;
            try {
                certificateList = await API.getSilent(`/certificate/by-user/${userId}`);
            } catch (ex) {
                panel.innerHTML = `<div class="sub-note" style="padding-left:0">${esc(ex.message)}</div>`;
                return;
            }

            // Bấm nhanh sang người khác trong lúc request còn đang chạy thì kết quả về muộn này đã lỗi thời
            // — ghi nó vào bộ nhớ đệm thì được, nhưng KHÔNG được vẽ đè lên người đang chọn.
            certByUser.set(userId, certificateList);
            certificateList.forEach(c => certById.set(c.id, c));
            if (selectedUserId !== userId) return;
        }

        panel.innerHTML = subordinatePanelHtml(person, certByUser.get(userId));
    }

    function subordinatePanelHtml(person, certificateList) {
        const head = person ? `
            <div class="sub-panel-head">
                <b>${esc(person.fullName)}</b>
                <small>${esc(person.employeeCode)}${person.departmentName ? ' · ' + esc(person.departmentName) : ''}${person.positionName ? ' · ' + esc(person.positionName) : ''}</small>
                <small>${certificateList.length} chứng nhận</small>
            </div>` : '';

        if (!certificateList.length)
            return head + '<div class="sub-note" style="padding-left:0">Người này chưa được cấp chứng nhận nào.</div>';

        return head + `<div class="vip-cert-list">${certificateList.map(vipCertItemHtml).join('')}</div>`;
    }

    function showCertificate(c) {
        document.getElementById('cert-view').innerHTML = `
            <!-- Khung bao ngoài với tỷ lệ dọc khổ A4, đổ bóng nhẹ -->
            <div class="cert ${c.isRevoked ? 'revoked' : ''}" style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); box-sizing: border-box; aspect-ratio: 1 / 1.414;">
                
                <!-- Viền kép màu Xanh Navy: Viền ngoài dày 3px, viền trong mảnh 1px -->
                <div style="width: 100%; height: 100%; border: 3px solid #0f4c81; padding: 8px; box-sizing: border-box;">
                    <div style="width: 100%; height: 100%; border: 1px solid #0f4c81; box-sizing: border-box; position: relative; padding: 40px 30px; text-align: center; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle, #f4fbff 0%, #ffffff 100%);">
                        
                        <!-- Hoa văn góc (4 góc viền vuông) -->
                        <div style="position: absolute; top: 12px; left: 12px; width: 30px; height: 30px; border-top: 2px solid #0f4c81; border-left: 2px solid #0f4c81;"></div>
                        <div style="position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-top: 2px solid #0f4c81; border-right: 2px solid #0f4c81;"></div>
                        <div style="position: absolute; bottom: 12px; left: 12px; width: 30px; height: 30px; border-bottom: 2px solid #0f4c81; border-left: 2px solid #0f4c81;"></div>
                        <div style="position: absolute; bottom: 12px; right: 12px; width: 30px; height: 30px; border-bottom: 2px solid #0f4c81; border-right: 2px solid #0f4c81;"></div>

                        <!-- Con dấu Xanh Gradient trên cùng -->
                        <div style="width: 76px; height: 76px; background: linear-gradient(135deg, #0f4c81, #00a1e5, #003f5c, #0ea5e9, #0f4c81); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-bottom: 24px; border: 2px dashed #fff; outline: 3px solid #0f4c81;">
                            <i class="ph-fill ph-crown" style="font-size: 36px; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);"></i>
                        </div>

                        <!-- Chữ CERTIFICATE to bản, có chân -->
                        <h1 style="font-family: 'Times New Roman', serif; color: #0f4c81; font-size: 46px; letter-spacing: 8px; margin: 0 0 12px 0; font-weight: normal; text-transform: uppercase;">Certificate</h1>
                        
                        <!-- Dải sao trang trí màu xanh sáng -->
                        <div style="color: #00a1e5; font-size: 14px; letter-spacing: 6px; margin-bottom: 24px;">
                            ★ ★ ★ ★ ★ ★ ★
                        </div>

                        <div style="font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px;">
                            CHỨNG NHẬN KẾT QUẢ ĐÀO TẠO
                        </div>

                        <!-- Đường gạch họa tiết trên Tên -->
                        <div style="display: flex; align-items: center; justify-content: center; width: 90%; margin-bottom: 10px;">
                            <div style="width: 6px; height: 6px; background: #0f4c81; transform: rotate(45deg);"></div>
                            <div style="flex: 1; height: 1px; background: #0f4c81; margin: 0 8px;"></div>
                            <div style="width: 8px; height: 8px; background: #00a1e5; transform: rotate(45deg);"></div>
                            <div style="flex: 1; height: 1px; background: #0f4c81; margin: 0 8px;"></div>
                            <div style="width: 6px; height: 6px; background: #0f4c81; transform: rotate(45deg);"></div>
                        </div>

                        <!-- TÊN HỌC VIÊN: Dùng font uốn lượn thư pháp -->
                        <div class="cert-name" style="font-family: 'Great Vibes', 'Brush Script MT', cursive; font-size: 56px; color: #0f4c81; margin: 16px 0; font-weight: 500; text-shadow: 1px 1px 0px rgba(0,0,0,0.05); line-height: 1;">
                            ${esc(c.userFullName)}
                        </div>

                        <!-- Đường gạch họa tiết dưới Tên -->
                        <div style="display: flex; align-items: center; justify-content: center; width: 90%; margin-top: 10px; margin-bottom: 30px;">
                            <div style="width: 6px; height: 6px; background: #0f4c81; transform: rotate(45deg);"></div>
                            <div style="flex: 1; height: 1px; background: #0f4c81; margin: 0 8px;"></div>
                            <div style="width: 8px; height: 8px; background: #00a1e5; transform: rotate(45deg);"></div>
                            <div style="flex: 1; height: 1px; background: #0f4c81; margin: 0 8px;"></div>
                            <div style="width: 6px; height: 6px; background: #0f4c81; transform: rotate(45deg);"></div>
                        </div>

                        <div style="font-family: 'Times New Roman', serif; font-size: 18px; font-weight: bold; color: #222; letter-spacing: 2px; margin-bottom: 15px;">
                            HONOR CERTIFICATE
                        </div>

                        <div style="font-size: 14px; color: #555; line-height: 1.6; padding: 0 20px; font-style: italic;">
                            Mã nhân viên: ${esc(c.employeeCode)}<br>
                            Đã hoàn thành xuất sắc khóa đào tạo<br>
                            <strong style="font-style: normal; color: #0f4c81; font-size: 18px; display: block; margin-top: 8px;">${esc(c.courseTitle)}</strong>
                        </div>

                        ${c.isRevoked ? '<div style="margin-top: 15px; background: #ef4444; color: white; padding: 4px 12px; font-size: 12px; font-weight: bold;">ĐÃ BỊ THU HỒI</div>' : ''}

                        <!-- Chân trang: Chữ ký, Mã QR, Ngày tháng -->
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%; margin-top: auto; padding-top: 20px;">
                            
                            <!-- Trái: QR Code -->
                            <div style="text-align: center; width: 100px;">
                                ${c.qrCodeUrl ? `
                                <img src="${esc(c.qrCodeUrl)}" alt="QR" style="width: 64px; height: 64px; margin-bottom: 8px; border: 1px solid #e5e7eb; padding: 2px;">
                                ` : '<div style="height: 64px; margin-bottom: 8px;"></div>'}
                                <div style="border-top: 1px solid #ccc; font-size: 11px; padding-top: 5px; color: #555; font-family: 'Times New Roman', serif;">Mã xác thực</div>
                            </div>

                            <!-- Giữa: Các icon và điểm -->
                            <div style="text-align: center; flex: 1;">
                                <div style="display: flex; justify-content: center; gap: 12px; font-size: 18px; color: #00a1e5; margin-bottom: 8px;">
                                    <i class="ph-fill ph-medal"></i>
                                    <i class="ph-fill ph-star"></i>
                                    <i class="ph-fill ph-graduation-cap"></i>
                                </div>
                                <div style="font-size: 11px; color: #666; font-family: 'Times New Roman', serif;">
                                    Số hiệu: ${esc(c.certificateNo)}<br>
                                    Đánh giá: <strong style="color: #0f4c81;">${c.finalScore}/100</strong>
                                </div>
                            </div>

                            <!-- Phải: Chữ ký & Ngày -->
                            <div style="text-align: center; width: 100px;">
                                <div style="font-family: 'Great Vibes', 'Brush Script MT', cursive; font-size: 28px; color: #0f4c81; margin-bottom: 8px;">HB Group</div>
                                <div style="border-top: 1px solid #ccc; font-size: 11px; padding-top: 5px; color: #555; font-family: 'Times New Roman', serif;">Ngày ${formatDate(c.issuedAt)}</div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>`;
        openModal('modal-cert');
    }
})();
</script>
</body>
</html>
