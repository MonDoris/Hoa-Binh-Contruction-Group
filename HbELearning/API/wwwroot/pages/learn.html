<!-- File: wwwroot/pages/learn.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: máy có tai thỏ thì trang phủ kín màn hình, phần né tai thỏ do CSS lo bằng env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Màu thanh trạng thái, biểu tượng, manifest và service worker — xem js/head.js. Nạp đồng bộ và
         đứng trước <title> để các thẻ đó có mặt trước khi trang bắt đầu vẽ. -->
    <script src="/js/head.js"></script>
    <title data-i18n="learn.hocBaiHbELearning">Học bài · HB E-Learning</title>
    <!-- Thêm font Inter cao cấp -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* ==================== VIP PRO UI OVERRIDES ====================
           Giao diện riêng của màn hình học bài. Khối này chỉ ảnh hưởng learn.html (nằm trong <style> của
           chính trang), nhưng nó CỐ Ý đè lên .card/.btn/.stat của css/style.css — nghĩa là trang này
           trông khác 24 trang còn lại ở chữ (Inter thay vì Manrope), bo góc và đổ bóng đậm hơn. Riêng
           MÀU CHÍNH thì vẫn là xanh thương hiệu #00a1e6 như toàn hệ thống — màu nhấn là thứ người dùng
           học để nhận ra "chỗ này bấm được", đổi riêng ở một màn hình là bắt họ học lại.
           Biến riêng đặt tiền tố --vip- nên không đụng biến dùng chung. */
        :root {
            --vip-primary: #00a1e6;
            --vip-primary-hover: #0284c7;
            /* Nền mờ và quầng sáng của màu chính. Để thành biến vì cùng một màu dùng ở sáu chỗ với ba độ
               trong khác nhau — ghi rgba thẳng vào từng chỗ thì lần đổi màu sau lại sót. */
            --vip-primary-soft: rgba(0, 161, 230, 0.08);
            --vip-primary-glow: rgba(0, 161, 230, 0.25);
            --vip-primary-glow-strong: rgba(0, 161, 230, 0.35);
            --vip-bg: #f8fafc;
            --vip-surface: #ffffff;
            --vip-text-main: #0f172a;
            --vip-text-muted: #64748b;
            --vip-border: #e2e8f0;
            --vip-success: #10b981;
            --vip-success-bg: #d1fae5;
            --vip-danger: #ef4444;
            --vip-radius-xl: 20px;
            --vip-radius-lg: 16px;
            --vip-radius-md: 12px;
            --vip-shadow-soft: 0 4px 24px -6px rgba(15, 23, 42, 0.08);
            --vip-shadow-floating: 0 20px 40px -10px rgba(15, 23, 42, 0.12);
        }

        [data-theme='dark'] {
            --vip-bg: #0b0f19;
            --vip-surface: #111827;
            --vip-text-main: #f8fafc;
            --vip-text-muted: #94a3b8;
            --vip-border: #1f2937;
            --vip-success-bg: rgba(16, 185, 129, 0.15);
            --vip-shadow-soft: 0 4px 24px -6px rgba(0, 0, 0, 0.5);
            /* Lớp phủ 8% chìm nghỉm trên nền tối — đậm tay lên mới thấy dòng đang chọn. */
            --vip-primary-soft: rgba(0, 161, 230, 0.16);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--vip-bg);
            color: var(--vip-text-main);
        }

        /* ----- Main Layout ----- */
        .learn-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 32px;
            padding: 32px;
            max-width: 1700px;
            margin: 0 auto;
            align-items: start;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.learn-tree-collapsed .learn-grid {
            grid-template-columns: 1fr 70px;
        }

        /* ----- Premium Cards ----- */
        .card {
            background: var(--vip-surface);
            border-radius: var(--vip-radius-xl);
            box-shadow: var(--vip-shadow-soft);
            border: 1px solid var(--vip-border);
            overflow: hidden;
            transition: 0.3s ease;
        }

        .card-head {
            padding: 24px 32px;
            border-bottom: 1px solid var(--vip-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.01);
            backdrop-filter: blur(8px);
        }

        .card-head h3 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .card-body {
            padding: 32px;
        }

        /* ----- Sticky Sidebar (Tree) ----- */
        .learn-tree-card {
            position: sticky;
            top: 24px;
            max-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
        }

        .learn-tree-card .card-body {
            overflow-y: auto;
            padding: 16px !important;
            scrollbar-width: thin;
            scrollbar-color: var(--vip-border) transparent;
        }

        body.learn-tree-collapsed .learn-tree-card h3,
        body.learn-tree-collapsed .learn-tree-card .card-body {
            display: none;
        }
        body.learn-tree-collapsed .learn-tree-card .card-head {
            justify-content: center;
            padding: 24px 0;
        }

        /* ----- Premium Tree Outline (Cột phải) ----- */
        /* Đầu nhóm tuần. KHÔNG dùng justify-content: space-between ở đây: khối này có ba phần tử con
           (biểu tượng, nhãn tuần, huy hiệu "Tuần này"), space-between sẽ đẩy biểu tượng và nhãn văng ra
           hai mép. Huy hiệu tự dạt phải nhờ margin-left: auto trong css/style.css. */
        .week-head {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--vip-text-muted);
            padding: 16px 12px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--vip-border);
            margin-bottom: 12px;
        }
        .week-head .week-head-label { font-size: inherit; color: inherit; letter-spacing: inherit; }

        .path-branch {
            margin-bottom: 4px;
        }

        .path-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-radius: var(--vip-radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            border: 1px solid transparent;
        }

        .path-item:hover {
            background: var(--vip-bg);
        }

        .path-item.active {
            background: var(--vip-primary-soft);
            border-color: transparent;
        }
        .path-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10%;
            height: 80%;
            width: 4px;
            background: var(--vip-primary);
            border-radius: 0 4px 4px 0;
        }

        .path-caret {
            background: transparent;
            border: none;
            color: var(--vip-text-muted);
            cursor: pointer;
            padding: 4px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.2s;
            margin-top: 4px;
        }
        .path-caret:hover {
            background: var(--vip-border);
            color: var(--vip-text-main);
        }

        .path-item .mark {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--vip-bg);
            border: 1px solid var(--vip-border);
            color: var(--vip-text-muted);
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
            transition: 0.3s;
            margin-top: 2px;
        }

        .path-item.done .mark {
            background: var(--vip-success);
            border-color: var(--vip-success);
            color: white;
        }

        .path-item.active .mark {
            background: var(--vip-primary);
            border-color: var(--vip-primary);
            color: white;
            box-shadow: 0 4px 10px var(--vip-primary-glow);
        }

        .path-item .txt { flex-grow: 1; margin-top: 4px; }
        .path-item .txt b { display: block; font-size: 0.95rem; margin-bottom: 6px; color: var(--vip-text-main); line-height: 1.3; }
        .path-item .txt small { color: var(--vip-text-muted); display: flex; align-items: center; gap: 4px; font-size: 0.8rem; }

        .path-children {
            margin-left: 35px;
            padding-left: 20px;
            border-left: 2px solid var(--vip-border);
            margin-top: 4px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .path-part-row {
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .path-part-row:hover {
            background: var(--vip-bg);
        }
        .path-part-row.active {
            background: var(--vip-primary-soft);
            color: var(--vip-primary) !important;
            font-weight: 600;
        }

        /* ----- Buttons & Interactive ----- */
        .btn {
            padding: 12px 24px;
            border-radius: var(--vip-radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn:not(.ghost) {
            background: var(--vip-primary);
            color: white;
            box-shadow: 0 4px 12px var(--vip-primary-glow);
        }

        .btn:not(.ghost):not(:disabled):hover {
            background: var(--vip-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--vip-primary-glow-strong);
        }

        .btn.ghost {
            background: transparent;
            border: 1px solid var(--vip-border);
            color: var(--vip-text-main);
            box-shadow: none;
        }

        .btn.ghost:hover {
            background: var(--vip-bg);
            border-color: var(--vip-text-muted);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Toggle Button */
        .learn-tree-toggle {
            background: var(--vip-bg);
            border: 1px solid var(--vip-border);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--vip-text-muted);
            transition: 0.3s;
        }
        .learn-tree-toggle:hover { background: var(--vip-surface); color: var(--vip-primary); box-shadow: var(--vip-shadow-soft); }
        body.learn-tree-collapsed .learn-tree-toggle i { transform: rotate(180deg); }

        /* ----- VIP Video Box & Content ----- */
        /* KHÔNG đặt aspect-ratio ở đây: khối này bọc CẢ trình phát — khung hình, thanh điều khiển, thanh
           chương và dòng chú thích — chứ không riêng thẻ <video>. Ép nó thành 16:9 rồi overflow: hidden thì
           mọi thứ nằm dưới khung hình bị cắt cụt, người học không còn nút phát lẫn thanh tua.
           Tỉ lệ khung hình do chính thẻ <video> lo (xem .vl-video trong css/style.css). */
        #lesson-video {
            border-radius: var(--vip-radius-lg);
            overflow: hidden;
            box-shadow: var(--vip-shadow-floating);
            background: #000;
            margin-bottom: 24px;
        }
        /* Bo góc ngoài mới ăn: .vl-player tự đặt bo góc riêng và nằm đè lên góc của khối bọc. */
        #lesson-video .vl-player { border-radius: inherit; box-shadow: none; }

        /* Stats Grid (Quiz/3D) */
        .grid-3, .grid-2 {
            display: grid;
            gap: 16px;
            margin-bottom: 24px;
        }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }

        .stat {
            background: var(--vip-bg);
            border: 1px solid var(--vip-border);
            padding: 20px;
            border-radius: var(--vip-radius-lg);
            text-align: center;
            transition: 0.3s;
        }
        .stat:hover { border-color: var(--vip-primary); transform: translateY(-2px); }
        .stat .label { color: var(--vip-text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        .stat .value { font-size: 1.5rem; font-weight: 800; color: var(--vip-text-main); }
        .stat.ok .value { color: var(--vip-success); }
        .stat.bad .value { color: var(--vip-danger); }

        /* Typography utilities */
        .small.muted { color: var(--vip-text-muted); font-size: 0.85rem; line-height: 1.5; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }

        /* Topbar Subtitle Badge Styling */
        .topbar .sub { font-size: 0.9rem; color: var(--vip-text-muted); font-weight: 500; margin-top: 8px; }
        .badge.green { background: var(--vip-success-bg); color: var(--vip-success); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }

        /* ==================== ĐIỆN THOẠI ====================
           Bắt buộc phải có: các quy tắc bố cục ở trên nằm NGOÀI mọi @media, mà khối <style> này đứng sau
           css/style.css với cùng độ đặc hiệu — nên nó thắng cả những quy tắc gập cột trong @media của
           style.css. Thiếu khối dưới đây thì mở màn hình học trên điện thoại vẫn giữ nguyên hai cột
           1fr + 400px và tràn ngang. */
        @media (max-width: 768px) {
            .learn-grid,
            body.learn-tree-collapsed .learn-grid {
                grid-template-columns: 1fr;
                padding: 16px;
                gap: 20px;
            }
            /* Một cột thì cây không dính theo màn hình nữa — dính sẽ che mất nội dung đang đọc. */
            .learn-tree-card { position: static; max-height: none; }
            .learn-tree-card .card-body { max-height: 60vh; }
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
            .card-head { padding: 18px 20px; }
            .card-body { padding: 20px; }
        }
    </style>

    <script>(function(){var t=localStorage.getItem('hbe_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div class="main">
    <div class="content">
        <div class="learn-grid">
            <!-- Nội dung bài học -->
            <div class="card">
                <div class="card-head">
                    <h3 data-i18n="learn.chonMotBuocTrongLoTrinh" id="item-title">Chọn một bước trong lộ trình</h3>
                    <span id="item-meta" class="small muted"></span>
                </div>
                <div class="card-body" id="item-box"></div>
            </div>

            <!-- Cây nội dung khóa học: bài học -> phần bên trong (video/lý thuyết, kiểm tra, mô phỏng 3D
                 gắn theo bài) -> câu hỏi chèn giữa video. Gộp làm một cột thay cho hai khối rời trước đây
                 (lộ trình ở cột này, danh sách câu hỏi video nằm dưới nội dung bài học). -->
            <div class="card learn-tree-card" style="position:sticky;top:20px">
                <div class="card-head">
                    <h3 data-i18n="learn.noiDungKhoaHoc">Nội dung khóa học</h3>
                    <button type="button" class="learn-tree-toggle" id="learn-tree-toggle">
                        <i class="ph-bold ph-caret-double-right"></i>
                    </button>
                </div>
                <div class="card-body" id="path-box" style="padding:10px"></div>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/language.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/password.js"></script>
<script src="/js/app.js"></script>
<script src="/js/video-learning.js"></script>
<script src="/js/lesson-note.js"></script>
<script>
(async function () {
    // Chờ /locales/*.json tải xong rồi mới dựng giao diện — t() là hàm đồng bộ.
    await Lang.ready;

    if (!Auth.require()) return;

    const enrollmentId = parseInt(qs('enrollmentId') || '0', 10);
    if (!enrollmentId) { location.href = '/pages/my-course.html'; return; }

    let detail = null;
    let currentStep = null;
    let heartbeatTimer = null;
    let videoPlayer = null;      // trình phát của bài học video đang mở (null nếu bài học không phải video)
    let lessonNote = null;       // sổ ghi chú theo mốc thời gian của bài video đang mở (js/lesson-note.js)
    let videoSecond = 0;         // vị trí đang xem, gửi kèm heartbeat để lần sau học tiếp đúng chỗ
    let videoMaxWatched = 0;     // mốc xa nhất đã xem, gửi kèm heartbeat để bài "bắt buộc xem hết" nhớ được

    // ---------- Trạng thái của cây nội dung ở cột phải ----------
    // Phải khai báo Ở ĐÂY, trước lời gọi await reload() bên dưới: reload() gọi renderPath() ngay khi vừa lấy
    // xong dữ liệu, mà renderPath() đọc các biến này. Khai báo chúng ở dưới (cạnh nhóm hàm dựng cây) thì lúc
    // đó chúng còn trong Temporal Dead Zone — cây không hiện ra mà cũng không có lỗi nào nổi lên màn hình,
    // vì ngoại lệ chìm vào một promise không ai bắt.

    /** Nhánh nào đang mở, theo stepId. Phải sống ngoài renderPath vì renderPath được gọi lại sau mỗi thao
     *  tác (chọn bước, trả lời câu hỏi) — giữ trong hàm thì cây tự đóng sập lại ngay dưới tay người dùng. */
    const expandedSet = new Set();

    /** Nội dung video đã tải, theo lessonId: { checkpointList, chapterList }. Chỉ tải khi người học bấm mở
     *  nhánh video đó. Giữ luôn bản đồ chương cạnh danh sách câu hỏi vì cây nội dung xếp câu hỏi vào chương
     *  chứa nó — thiếu một trong hai thì không dựng được mục lục. */
    const videoQuestionCache = new Map();
    /** lessonId đang tải câu hỏi — chặn bấm liên tục gọi API chồng lên nhau. */
    const videoQuestionLoading = new Set();

    // ---------- Thu gọn cột "Nội dung khóa học" ----------
    // Thu lại thì cột phải còn một dải hẹp chỉ có nút và tên cột dựng đứng, phần video + nội dung bài học bên
    // trái giãn rộng ra chiếm chỗ. Cố ý KHÔNG ẩn hẳn cột: ẩn hẳn thì không còn chỗ nào bấm để mở lại.
    //
    // Cũng phải khai báo Ở ĐÂY, trước lời gọi mountTreeToggle() bên dưới. Để ở dưới thì hằng khóa lưu trữ còn
    // trong Temporal Dead Zone, và cái try/catch dưới kia — vốn để đỡ localStorage bị chặn ở chế độ riêng tư —
    // nuốt luôn ReferenceError rồi trả về false: cột cứ mở toang mỗi lần tải trang, không một lỗi nào nổi lên.
    const LEARN_TREE_COLLAPSED_KEY = 'hbe_learn_tree_collapsed';

    function isTreeCollapsed() {
        try { return localStorage.getItem(LEARN_TREE_COLLAPSED_KEY) === '1'; }
        catch { return false; }
    }

    function applyTreeCollapsed(collapsed) {
        document.body.classList.toggle('learn-tree-collapsed', collapsed);
        const button = document.getElementById('learn-tree-toggle');
        if (button) button.title = collapsed
            ? t('learn.moRongCotNoiDung', 'Mở rộng cột nội dung')
            : t('learn.thuGonCotNoiDung', 'Thu gọn cột nội dung');
    }

    function mountTreeToggle() {
        applyTreeCollapsed(isTreeCollapsed());
        document.getElementById('learn-tree-toggle')?.addEventListener('click', () => {
            const collapsed = !isTreeCollapsed();
            try { localStorage.setItem(LEARN_TREE_COLLAPSED_KEY, collapsed ? '1' : '0'); } catch { /* chế độ riêng tư */ }
            applyTreeCollapsed(collapsed);
        });
    }

    mountLayout('my-course', t('classroom.dangTai', 'Đang tải...'), '');
    mountTreeToggle();
    await reload();

    // Ngừng đếm thời gian + tắt tiếng video khi rời trang
    window.addEventListener('beforeunload', () => { stopHeartbeat(); stopVideo(); });

    async function reload(keepStepId = null) {
        try {
            detail = await API.get(`/enrollment/${enrollmentId}`);
        } catch (ex) {
            document.getElementById('path-box').innerHTML = emptyHtml(ex.message, '<i class="ph ph-warning"></i>');
            return;
        }

        document.querySelector('.topbar h1').textContent = detail.courseTitle;
        document.querySelector('.topbar .sub')?.remove();
        document.querySelector('.topbar h1').insertAdjacentHTML('afterend',
            `<div class="sub">${esc(detail.courseCode)} · Tiến độ ${detail.progressPercent}%
             ${detail.status === 'Completed' ? '· <span data-i18n="index.stat-enroll" class="badge green">Hoàn thành</span>' : ''}</div>`);

        setTopbarAction(`
            ${detail.hasCertificate ? '<a href="/pages/certificate.html" class="btn ghost sm"><i class="ph ph-seal-check"></i> <span data-i18n="learn.xemChungNhan">Xem chứng nhận</span></a>' : ''}
            <a href="/pages/my-course.html" class="btn ghost sm"><i class="ph ph-arrow-left"></i> <span data-i18n="learn.danhSach">Danh sách</span></a>`);

        renderPath();

        // Mở lại bước đang xem, hoặc bước đầu tiên chưa hoàn thành
        const target = keepStepId
            ? detail.pathList.find(x => stepId(x) === keepStepId)
            : detail.pathList.find(x => x.isUnlocked && x.status !== 'Completed') || detail.pathList[0];

        if (target) selectStep(target);
    }

    // Khai báo dạng function (được hoisting đầy đủ) — reload() gọi renderPath() ngay khi vừa
    // await xong, tại thời điểm đó dòng "const stepId = ..." nếu khai báo bên dưới vẫn chưa
    // chạy tới (còn trong Temporal Dead Zone), gây lỗi runtime âm thầm khiến lộ trình không hiện.
    function stepId(step) { return `${step.itemType}-${step.lessonId ?? step.quizId ?? step.scenarioSceneId}`; }

    /** Lý do một bước đang bị khóa: theo lịch (chưa tới ngày / đã hết hạn) hoặc theo thứ tự lộ trình. */
    function lockReason(step) {
        if (step.isUnlocked) return null;
        const now = new Date();
        if (step.startDate && now < new Date(step.startDate))
            return `Mở khóa từ ${formatDate(step.startDate, true)}`;
        if ((step.itemType === 'Quiz' || step.itemType === 'Simulation') && step.endDate && now > new Date(step.endDate))
            return t('learn.daHetHan', 'Đã hết hạn');
        return t('learn.banCanHoanThanhCacBuocTruocDo', 'Bạn cần hoàn thành các bước trước đó.');
    }

    // ==================== CÂY NỘI DUNG KHÓA HỌC ====================
    // Ba cấp: bài học -> phần bên trong bài (nội dung video/lý thuyết, bài kiểm tra và mô phỏng 3D gắn theo
    // bài đó) -> câu hỏi chèn giữa video. Bước không gắn bài học nào (VD thi cuối khóa) đứng riêng một mình
    // ở đúng vị trí của nó trong lộ trình, không bị nhét vào bài nào cả.

    /**
     * Gom danh sách bước phẳng thành từng nhánh. Bước Bài học mở một nhánh mới; bước Kiểm tra / Mô phỏng 3D
     * có parentLessonId trỏ về bài học đó thì chui vào làm con. Bước đứng riêng thành một nhánh chỉ có mình nó.
     *
     * Duyệt theo đúng thứ tự lộ trình và chỉ gom vào nhánh LIỀN TRƯỚC: bước con nằm tận cuối lộ trình mà bị
     * kéo ngược lên cạnh bài học của nó thì số thứ tự trong cây sẽ nhảy cóc, người học không còn đối chiếu
     * được với thứ tự thật sự phải làm.
     */
    function buildTree(orderedList) {
        const branchList = [];
        let current = null;

        for (const entry of orderedList) {
            const step = entry.step;
            const isChild = step.itemType !== 'Lesson'
                && step.parentLessonId != null
                && current
                && current.head.step.itemType === 'Lesson'
                && current.head.step.lessonId === step.parentLessonId;

            if (isChild) { current.childList.push(entry); continue; }

            current = { head: entry, childList: [] };
            branchList.push(current);
        }
        return branchList;
    }

    /** Một dòng bước (dùng cho cả đầu nhánh lẫn bước con). */
    function renderStepRow(step, order, extraClass) {
        const done = step.status === 'Completed';
        const locked = !step.isUnlocked;
        const active = currentStep && stepId(currentStep) === stepId(step);
        const meta = stepTypeMeta(step.itemType);   // js/app.js — dùng chung với cây lộ trình bên quản trị

        return `<div class="path-item ${extraClass || ''} ${done ? 'done' : ''} ${locked ? 'locked' : ''} ${active ? 'active' : ''}"
                     data-step="${esc(stepId(step))}">
            <div class="mark">${done ? '<i class="ph-bold ph-check"></i>' : locked ? '<i class="ph ph-lock"></i>' : order}</div>
            <div class="txt">
                <b>${esc(step.title)}</b>
                <small>${meta.icon} ${meta.label}
                    ${step.itemType !== 'Simulation' ? ` · ${formatDuration(step.durationMinutes)}` : ''}
                    ${step.bestScore != null ? ` · Điểm cao nhất: <b>${step.bestScore}</b>` : ''}</small>
                ${locked ? `<div class="small muted"><i class="ph ph-lock"></i> ${esc(lockReason(step))}</div>` : ''}
            </div>
        </div>`;
    }

    /** Nút mũi tên đóng/mở một nhánh. key là stepId của bước sở hữu nhánh đó. */
    function caretHtml(key, open) {
        return `<button type="button" class="path-caret ${open ? 'open' : ''}" data-toggle="${esc(key)}"
                        aria-expanded="${open}" title="${esc(open ? t('learn.thuGon', 'Thu gọn') : t('learn.moRong', 'Mở rộng'))}">
                    <i class="ph-bold ph-caret-right"></i>
                </button>`;
    }

    /** Dòng "phần nội dung" của một bài học — cấp 2 của cây (Video / Lý thuyết / Tài liệu...). */
    function renderLessonPartRow(step) {
        const meta = contentTypeMeta(step.contentType);   // js/app.js — dùng chung với trang quản lý nội dung
        const isVideo = step.contentType === 'Video';
        const count = step.videoQuestionCount || 0;
        const chapterCount = step.videoChapterCount || 0;
        // Bung được khi bài có bất kỳ thứ gì để xếp thành mục lục. Chỉ xét câu hỏi thì video đã chia chương
        // đàng hoàng mà chưa gắn câu nào lại thành một dòng câm, không ai biết bên trong nó có gì.
        const hasOutline = isVideo && (count > 0 || chapterCount > 0);
        const key = `q-${step.lessonId}`;
        const open = expandedSet.has(key);
        const active = currentStep && stepId(currentStep) === stepId(step);

        return `<div class="path-part">
            <div class="path-part-row ${active ? 'active' : ''}" data-step="${esc(stepId(step))}">
                ${hasOutline ? caretHtml(key, open) : '<span class="path-caret-space"></span>'}
                <i class="ph ${meta.iconClass} path-part-icon"></i>
                <span class="path-part-label">${esc(meta.label)}</span>
                ${chapterCount > 0 ? `<span class="path-part-count alt">${chapterCount} ${esc(t('learn.chuong', 'chương'))}</span>` : ''}
                ${count > 0 ? `<span class="path-part-count">${count} ${esc(t('learn.cauHoi', 'câu hỏi'))}</span>` : ''}
            </div>
            ${hasOutline && open
                ? `<div class="path-qbox" id="qbox-${step.lessonId}">${renderQuestionBox(step)}</div>`
                : ''}
        </div>`;
    }

    /**
     * Danh sách câu hỏi của một bài video trong cây.
     *
     * Bài ĐANG học trả về chuỗi rỗng có chủ đích: trình phát tự vẽ danh sách "sống" vào đúng ô này qua
     * questionListContainer (js/video-learning.js) — trạng thái đã trả lời, điểm và nút "Tới câu hỏi" phải
     * đổi ngay theo tiến độ xem, thứ mà một danh sách vẽ sẵn ở đây không làm được.
     * Bài chưa mở thì vẽ danh sách tĩnh từ dữ liệu vừa tải, không có nút nhảy tới (video chưa được nạp).
     */
    function renderQuestionBox(step) {
        if (currentStep && stepId(currentStep) === stepId(step)) return '';
        if (videoQuestionLoading.has(step.lessonId)) return skeletonHtml('text', { lines: 2 });

        const cached = videoQuestionCache.get(step.lessonId);
        if (!cached) return '';

        const list = cached.checkpointList;
        const chapterList = cached.chapterList;
        if (!list.length && !chapterList.length)
            return `<div class="small muted" style="padding:6px 10px">${esc(t('learn.baiNayChuaCoCauHoi', 'Bài này chưa có câu hỏi.'))}</div>`;

        // Cùng kiểu mục lục với bài đang học (js/video-learning.js vẽ), nhưng không bấm được ở đâu cả: video
        // của bài này chưa được nạp nên không có chỗ nào để nhảy tới. Chi tiết từng câu nằm ở thuộc tính title.
        const answered = list.filter(q => q.isAnswered).length;
        const body = chapterList.length
            ? vlBuildChapterOutline(list, chapterList).map(renderQuestionGroupStatic).join('')
            : `<div class="qgrid">${list.map((q, i) => renderQuestionCellStatic(q, i)).join('')}</div>`;

        // Bộ đếm và chú giải màu chỉ nói về câu hỏi — bài mới chỉ chia chương thì hai dòng đó rỗng nghĩa,
        // chừa ra cho mục lục chương đứng một mình.
        return `
            ${list.length ? `<div class="small muted" style="padding:0 0 7px">${answered}/${list.length} ${esc(t('learn.cauDaTraLoi', 'câu đã trả lời'))}</div>` : ''}
            ${body}
            ${list.length ? `<div class="qgrid-legend">
                <span><i></i> ${esc(t('learn.chuaTraLoi', 'Chưa trả lời'))}</span>
                <span><i class="lg-answered"></i> ${esc(t('learn.daTraLoi', 'Đã trả lời'))}</span>
                <span><i class="lg-passed"></i> ${esc(t('learn.daDat', 'Đã đạt'))}</span>
            </div>` : ''}`;
    }

    /** Một chương trong mục lục tĩnh: tên chương làm dòng cha, câu hỏi thuộc chương nằm ngay dưới. Dòng
     *  chương ở đây là chữ chứ không phải nút — bài này chưa được mở nên chưa có video nào để tua tới. */
    function renderQuestionGroupStatic(group) {
        const grid = group.itemList.length
            ? `<div class="qgrid">${group.itemList.map(x => renderQuestionCellStatic(x.checkpoint, x.index)).join('')}</div>`
            : `<div class="qgroup-empty">${esc(t('learn.doanNayKhongCoCauHoi', 'Đoạn này không có câu hỏi'))}</div>`;

        if (!group.chapter)
            return `<div class="qgroup">
                <div class="qgroup-head plain">
                    <i class="ph ph-dots-three-circle"></i>
                    <span class="qgroup-title">${esc(t('learn.ngoaiChuong', 'Ngoài chương'))}</span>
                    <span class="qgroup-count">${group.itemList.length}</span>
                </div>
                ${grid}
            </div>`;

        const chapter = group.chapter;
        const range = `${formatSecondClock(chapter.startSecond)}–${formatSecondClock(chapter.endSecond)}`;
        return `<div class="qgroup">
            <div class="qgroup-head plain" title="${esc(chapter.title)} — ${esc(range)}${chapter.topic ? ` · ${esc(chapter.topic)}` : ''}">
                <i class="ph ph-bookmark-simple"></i>
                <span class="qgroup-title">${esc(chapter.title)}</span>
                <span class="qgroup-time">${esc(formatSecondClock(chapter.startSecond))}</span>
                ${group.itemList.length ? `<span class="qgroup-count">${group.itemList.length}</span>` : ''}
            </div>
            ${chapter.topic ? `<div class="qgroup-topic">${esc(chapter.topic)}</div>` : ''}
            ${grid}
        </div>`;
    }

    /** Một ô số trong lưới câu hỏi tĩnh. index là số thứ tự trong CẢ bài, không đánh lại theo từng chương —
     *  phải khớp với số mà trình phát hiện khi mở bài này ra. */
    function renderQuestionCellStatic(q, index) {
        const detail = [
            formatSecondClock(q.atSecond),
            q.score > 0 ? `${q.isAnswered ? `${q.earnedScore}/` : ''}${q.score} điểm` : null,
            q.mustAnswerCorrectly ? t('learn.phaiTraLoiDung', 'Phải trả lời đúng') : null
        ].filter(Boolean).join(' · ');

        return `<button type="button" class="qgrid-item ${q.isPassed ? 'passed' : q.isAnswered ? 'answered' : ''}"
                        disabled title="Câu ${index + 1}: ${esc(q.content)} — ${esc(detail)}">${index + 1}</button>`;
    }

    /** Giây -> "m:ss", khớp cách trình phát hiển thị mốc câu hỏi. */
    function formatSecondClock(second) {
        const s = Math.max(0, Math.floor(second || 0));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function renderPath() {
        const box = document.getElementById('path-box');
        if (!detail.pathList.length) {
            box.innerHTML = emptyHtml(t('learn.khoaHocChuaCoNoiDung', 'Khóa học chưa có nội dung.'));
            return;
        }

        // Đánh số thứ tự tuyệt đối trước khi nhóm, để giữ đúng thứ tự lộ trình.
        const orderedList = detail.pathList.map((step, i) => ({ step, order: i + 1 }));
        const weekGroupList = groupByWeek(buildTree(orderedList), (b) => b.head.step.startDate);

        box.innerHTML = weekGroupList.map(group => `
            <div class="path-week">
                ${weekHeadHtml(group)}
                ${group.itemList.map(renderBranch).join('')}
            </div>`).join('');

        bindPathEvents(box);

        // Trình phát vẽ danh sách câu hỏi "sống" vào ô của bài ĐANG học. Mỗi lần vẽ lại cây là ô đó bị thay
        // bằng một phần tử mới, nên phải trỏ trình phát sang ô mới — không thì chỉ cần đóng/mở một nhánh bất
        // kỳ là danh sách câu hỏi của bài đang xem biến mất.
        if (videoPlayer && currentStep && currentStep.lessonId)
            videoPlayer.remountQuestionList(document.getElementById(`qbox-${currentStep.lessonId}`));
    }

    function renderBranch(branch) {
        const headStep = branch.head.step;
        const isLesson = headStep.itemType === 'Lesson';
        // Bài học luôn có ít nhất phần nội dung của chính nó để mở ra; bước đứng riêng thì không có gì bên trong.
        const hasChildren = isLesson || branch.childList.length > 0;
        const key = stepId(headStep);
        const open = expandedSet.has(key);

        return `<div class="path-branch ${open ? 'open' : ''}">
            <div class="path-branch-head">
                ${hasChildren ? caretHtml(key, open) : '<span class="path-caret-space"></span>'}
                ${renderStepRow(headStep, branch.head.order, 'path-item-head')}
            </div>
            ${hasChildren && open ? `<div class="path-children">
                ${isLesson ? renderLessonPartRow(headStep) : ''}
                ${branch.childList.map(x => renderStepRow(x.step, x.order, 'path-item-child')).join('')}
            </div>` : ''}
        </div>`;
    }

    function bindPathEvents(box) {
        box.querySelectorAll('[data-toggle]').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation(); // đừng để cú bấm mở nhánh kéo theo việc chọn luôn bước đó
                const key = el.dataset.toggle;
                if (expandedSet.has(key)) expandedSet.delete(key);
                else {
                    expandedSet.add(key);
                    if (key.indexOf('q-') === 0) loadVideoQuestion(parseInt(key.slice(2), 10));
                }
                renderPath();
            });
        });

        box.querySelectorAll('[data-step]').forEach(el => {
            el.addEventListener('click', () => {
                const step = detail.pathList.find(x => stepId(x) === el.dataset.step);
                if (!step) return;
                if (!step.isUnlocked) { toastErr(lockReason(step)); return; }
                // Bấm vào bước đang mở sẵn thì không nạp lại — nạp lại là mất chỗ xem dở của video.
                if (currentStep && stepId(currentStep) === stepId(step)) return;
                expandedSet.add(stepId(step));
                selectStep(step);
            });
        });
    }

    /** Tải câu hỏi của một bài video khi người học mở nhánh đó ra. Lỗi thì báo và đóng nhánh lại. */
    async function loadVideoQuestion(lessonId) {
        if (!lessonId || videoQuestionCache.has(lessonId) || videoQuestionLoading.has(lessonId)) return;

        videoQuestionLoading.add(lessonId);
        renderPath();
        try {
            const data = await API.getSilent(`/videolearning/lesson/${lessonId}?enrollmentId=${enrollmentId}`);
            videoQuestionCache.set(lessonId, {
                checkpointList: data.checkpointList || [],
                // Lọc bỏ đoạn hỏng (kết thúc không sau mốc bắt đầu) đúng như trình phát làm, để mục lục tĩnh
                // ở đây và mục lục "sống" của trình phát không bao giờ hiện ra hai danh sách chương khác nhau.
                chapterList: (data.chapterList || []).filter(c => Number(c.endSecond) > Number(c.startSecond))
            });
        } catch (ex) {
            toastErr(`Không tải được câu hỏi trong video: ${ex.message}`);
            expandedSet.delete(`q-${lessonId}`);
        } finally {
            videoQuestionLoading.delete(lessonId);
            renderPath();
        }
    }

    async function selectStep(step) {
        stopHeartbeat();
        stopVideo();
        currentStep = step;

        // Mở sẵn nhánh của bước vừa chọn: đang học bài nào thì cây phải cho thấy bên trong bài đó có gì.
        // Bài video có câu hỏi thì mở luôn cả nhánh câu hỏi — ô rỗng đó chính là chỗ trình phát vẽ danh
        // sách "sống" vào (xem renderQuestionBox và mountLessonVideo).
        expandedSet.add(stepId(step));
        if (step.itemType === 'Lesson' && step.contentType === 'Video'
            && ((step.videoQuestionCount || 0) > 0 || (step.videoChapterCount || 0) > 0))
            expandedSet.add(`q-${step.lessonId}`);

        renderPath();

        document.getElementById('item-title').textContent = step.title;
        document.getElementById('item-meta').textContent = step.itemType === 'Simulation'
            ? t('course-detail.moPhong3d', 'Mô phỏng 3D')
            : `${step.itemType === 'Quiz' ? 'Bài kiểm tra' : t('index.stat-lesson', 'Bài học')} · ${formatDuration(step.durationMinutes)}`;

        const box = document.getElementById('item-box');
        box.innerHTML = skeletonHtml('detail', { lines: 6 });

        if (step.itemType === 'Quiz') { renderQuiz(step, box); return; }
        if (step.itemType === 'Simulation') { renderSimulationSummary(step, box); return; }

        try {
            const lesson = await API.get(`/lesson/${step.lessonId}`);
            box.innerHTML = renderLessonBody(lesson) + `
                <div class="flex-between mt" style="border-top:1px solid var(--border);padding-top:16px">
                    <span class="small muted">${step.status === 'Completed'
                        ? '<i class="ph ph-check-circle"></i> Bạn đã hoàn thành bài học này.'
                        : t('learn.docXongNoiDungRoiBamHoanThanhD', 'Đọc xong nội dung rồi bấm hoàn thành để mở bước tiếp theo.')}</span>
                    <button class="btn ${step.status === 'Completed' ? 'ghost' : ''}" id="btn-complete"
                        ${step.status === 'Completed' ? 'disabled' : ''}>
                        ${step.status === 'Completed' ? 'Đã hoàn thành' : '<i class="ph-bold ph-check"></i> Đánh dấu hoàn thành'}
                    </button>
                </div>`;

            document.getElementById('btn-complete')?.addEventListener('click', completeLesson);

            // Gọi start TRƯỚC khi gắn trình phát: bản ghi tiến độ phải tồn tại thì API câu hỏi mới đọc
            // được vị trí xem dở lần trước để phát tiếp đúng chỗ.
            await API.post(`/progress/lesson/start?enrollmentId=${enrollmentId}&lessonId=${step.lessonId}`);
            if (lesson.contentType === 'Video' && lesson.resourceUrl) await mountLessonVideo(lesson);
            startHeartbeat(step.lessonId);
        } catch (ex) {
            box.innerHTML = emptyHtml(ex.message, '<i class="ph ph-warning"></i>');
        }
    }

    function renderLessonBody(lesson) {
        const url = lesson.resourceUrl;
        let media = '';

        if (url) {
            // Video: chỉ dựng khung rỗng ở đây, mountLessonVideo() gắn trình phát vào sau khi lấy được
            // danh sách câu hỏi chèn giữa video (js/video-learning.js).
            if (lesson.contentType === 'Video')
                media = '<div id="lesson-video"></div>';
            else if (lesson.contentType === 'Image')
                media = `<img src="${esc(url)}" style="max-width:100%;border-radius:8px">`;
            else if (/\.pdf($|\?)/i.test(url))
                // PDF hiện ngay trong trang, đúng bản gốc từng trang từng dòng — tài liệu đào tạo dạng PDF
                // mà chỉ để một cái link thì học viên phải tải về, mở bằng ứng dụng khác, rồi mới quay lại
                // bấm hoàn thành. Vẫn giữ nút mở tab mới cho ai muốn xem toàn màn hình hoặc in.
                media = `
                    <div class="pdf-embed">
                        <iframe src="${esc(url)}#view=FitH" title="${esc(lesson.title || 'Tài liệu bài học')}"></iframe>
                    </div>
                    <div class="flex gap-sm mt">
                        <a class="btn ghost sm" href="${esc(url)}" target="_blank" rel="noopener">
                            <i class="ph ph-arrow-square-out"></i> ${esc(t('learn.moTabMoi', 'Mở ở tab mới'))}</a>
                        <a class="btn ghost sm" href="${esc(url)}" download>
                            <i class="ph ph-download-simple"></i> ${esc(t('learn.taiVe', 'Tải về'))}</a>
                    </div>`;
            else if (/\.pptx($|\?)/i.test(url))
                // Bài giảng PowerPoint đã dựng từng slide ngay bên dưới; file gốc chỉ để ai cần trình chiếu
                // lại (có hiệu ứng) thì tải về — trình duyệt không mở được .pptx nên đi thẳng lệnh tải.
                media = `<a class="btn ghost sm" href="${esc(url)}" download>
                            <i class="ph ph-microsoft-powerpoint-logo"></i> ${esc(t('learn.taiFilePowerPointGoc', 'Tải file PowerPoint gốc'))}</a>`;
            else
                media = `<a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener"><i class="ph ph-paperclip"></i> <span data-i18n="learn.moTaiLieuDinhKem">Mở tài liệu đính kèm</span></a>`;
        }

        // Danh sách câu hỏi trong video KHÔNG còn nằm dưới nội dung bài học nữa — nó đã dọn sang cây nội dung
        // ở cột phải, nằm đúng dưới nhánh video của bài này (xem renderLessonPartRow / renderQuestionBox).
        // Sổ ghi chú nằm NGAY DƯỚI video, trên phần nội dung chữ: bấm "Ghi chú tại đây" trên thanh điều
        // khiển thì ô soạn phải hiện ra trong tầm mắt, không bắt cuộn xuống cuối bài mới thấy.
        // Chỉ bài video mới có — ghi chú theo mốc thời gian không có nghĩa với bài lý thuyết hay PDF.
        const noteSlot = lesson.contentType === 'Video' && url ? '<div id="lesson-note"></div>' : '';

        return `${media ? `<div class="mb">${media}</div>` : ''}
                ${noteSlot}
                <div class="lesson-body">${lesson.content || '<p data-i18n="learn.baiHocNayChiGomTaiLieuDinhKem" class="muted">Bài học này chỉ gồm tài liệu đính kèm.</p>'}</div>`;
    }

    /** Gắn trình phát video có chèn câu hỏi. Không lấy được danh sách câu hỏi thì vẫn cho xem video
     *  bình thường (không chặn tua) — hỏng phần câu hỏi không nên chặn luôn việc học. */
    async function mountLessonVideo(lesson) {
        const container = document.getElementById('lesson-video');
        if (!container) return;

        let data = { lastPositionSecond: 0, checkpointList: [], chapterList: [], earnedScore: 0, totalScore: 0 };
        try {
            data = await API.get(`/videolearning/lesson/${lesson.id}?enrollmentId=${enrollmentId}`);
        } catch (ex) {
            toastErr(`Không tải được câu hỏi trong video: ${ex.message}`);
        }

        videoSecond = data.lastPositionSecond || 0;
        videoMaxWatched = data.maxWatchedSecond || 0;
        videoPlayer = mountVideoLearning({
            container,
            src: lesson.resourceUrl,
            checkpointList: data.checkpointList,
            // Bản đồ nội dung theo thời gian — trình phát hiện "đoạn đang xem thuộc chương nào, chủ đề nào".
            chapterList: data.chapterList,
            startAt: data.lastPositionSecond,
            earnedScore: data.earnedScore,
            totalScore: data.totalScore,
            // Cách tua lấy từ API câu hỏi chứ không từ lesson.videoSeekPolicy: hai giá trị vốn là một, nhưng
            // lấy cùng một chỗ với danh sách mốc thì không có cửa cho chúng lệch nhau.
            seekPolicy: data.seekPolicy,
            maxWatchedSecond: data.maxWatchedSecond,
            questionListContainer: document.getElementById(`qbox-${lesson.id}`),
            onAnswer: (checkpoint, selectedOptionIdList) => API.post('/videolearning/answer', {
                enrollmentId, videoQuestionId: checkpoint.id, selectedOptionIdList
            }),
            onTick: (second, maxWatchedSecond) => {
                videoSecond = second;
                videoMaxWatched = Math.max(videoMaxWatched, maxWatchedSecond || 0);
            },
            // Bấm nút ghi chú trên thanh điều khiển: trình phát dừng hình rồi báo giây đang xem sang đây.
            onNoteRequest: (second) => lessonNote?.compose(second),
        });

        // Sổ ghi chú dựng SAU trình phát vì nó cần đối tượng trình phát để tua về đoạn đã ghi.
        const noteBox = document.getElementById('lesson-note');
        if (noteBox)
            lessonNote = mountLessonNote({
                container: noteBox, enrollmentId, lessonId: lesson.id, player: videoPlayer
            });

        // Mỗi lần dừng hình là một lần ghi lại tiến độ. Nhịp heartbeat 30 giây quá thưa cho mốc "đã xem tới
        // đâu": xem 20 giây rồi tạm dừng đi làm việc khác là mất trắng, lần sau mở lại bài "bắt buộc xem hết"
        // vẫn phải xem từ đầu.
        videoPlayer.video.addEventListener('pause', flushVideoProgress);
    }

    /** Gửi ngay vị trí đang xem + mốc đã xem lên server (không cộng thêm thời gian học — việc đó của heartbeat). */
    function flushVideoProgress() {
        const lessonId = currentStep?.lessonId;
        if (!lessonId || !videoPlayer) return;
        API.post(`/progress/lesson/heartbeat?enrollmentId=${enrollmentId}&lessonId=${lessonId}`
               + `&timeSpentSecond=0&lastPositionSecond=${videoSecond}&maxWatchedSecond=${videoMaxWatched}`)
           .catch(() => {});
    }

    function stopVideo() {
        // Sổ ghi chú thuộc về đúng bài vừa rời: giữ lại là ghi chú bài cũ hiện dưới video bài mới.
        lessonNote?.destroy();
        lessonNote = null;

        // Rời bài video: bản danh sách câu hỏi tĩnh đã tải cho bài này (nếu có) giờ đã lỗi thời — người học
        // vừa trả lời thêm câu nào thì điểm và trạng thái trong đó đều sai. Bỏ đi để lần sau mở nhánh sẽ tải lại.
        if (currentStep && currentStep.lessonId) videoQuestionCache.delete(currentStep.lessonId);

        // Chốt tiến độ TRƯỚC khi hủy trình phát, lúc videoSecond/videoMaxWatched còn giá trị thật.
        flushVideoProgress();
        videoPlayer?.destroy();
        videoPlayer = null;
        videoSecond = 0;
        videoMaxWatched = 0;
    }

    async function completeLesson() {
        const button = document.getElementById('btn-complete');
        button.disabled = true;
        button.textContent = t('learn.dangLuu', 'Đang lưu...');
        try {
            const result = await API.post(`/progress/lesson/complete?enrollmentId=${enrollmentId}&lessonId=${currentStep.lessonId}`);
            toastOk(result.message);
            await reload();
        } catch (ex) {
            toastErr(ex.message);
            button.disabled = false;
            button.innerHTML = '<i class="ph-bold ph-check"></i> Đánh dấu hoàn thành';
        }
    }

    function renderQuiz(step, box) {
        const remaining = step.maxAttempt - step.attemptUsed;
        const passed = step.status === 'Completed';

        box.innerHTML = `
            <div class="grid grid-3 mb">
                <div class="stat"><div data-i18n="learn.soLanDaLamHomNay" class="label">Số lần đã làm hôm nay</div><div class="value">${step.attemptUsed}/${step.maxAttempt}</div></div>
                <div class="stat"><div data-i18n="learn.diemCaoNhat" class="label">Điểm cao nhất</div><div class="value">${step.bestScore ?? '—'}</div></div>
                ${resultTile(passed, { pending: true })}
            </div>
            <div class="flex-between" style="border-top:1px solid var(--border);padding-top:16px">
                <span class="small muted">Thời gian làm bài: ${formatDuration(step.durationMinutes)}
                    ${remaining <= 0 ? '· Lượt làm bài sẽ được làm mới vào ngày mai' : ''}</span>
                <div class="flex gap-sm">
                    ${step.hasEverAttempted ? `<a data-i18n="quiz.lichSuLamBai" class="btn ghost" href="/pages/quiz.html?mode=history&enrollmentId=${enrollmentId}&quizId=${step.quizId}">Lịch sử làm bài</a>` : ''}
                    ${remaining > 0
                        ? `<a class="btn" href="/pages/quiz.html?enrollmentId=${enrollmentId}&quizId=${step.quizId}">
                             ${step.hasEverAttempted ? 'Làm lại' : t('learn.batDauLamBai', 'Bắt đầu làm bài')} (còn ${remaining} lượt hôm nay)</a>`
                        : '<button data-i18n="learn.daHetLuotLamBaiHomNay" class="btn" disabled>Đã hết lượt làm bài hôm nay</button>'}
                </div>
            </div>`;
    }

    // Mô phỏng 3D không giới hạn số lượt chơi/ngày (khác Quiz) nên không hiện ô "số lần đã làm hôm nay".
    // Điểm có thể âm — không giả định luôn dương như Quiz.
    function renderSimulationSummary(step, box) {
        const passed = step.status === 'Completed';
        const hasScore = step.bestScore != null;
        const scoreClass = hasScore && step.bestScore < 0 ? 'bad' : (passed ? 'ok' : '');

        box.innerHTML = `
            <div class="grid grid-2 mb">
                <div class="stat ${scoreClass}"><div data-i18n="learn.diemCaoNhat" class="label">Điểm cao nhất</div><div class="value">${hasScore ? step.bestScore : '—'}</div></div>
                ${resultTile(passed, { pending: true })}
            </div>
            <div class="flex-between" style="border-top:1px solid var(--border);padding-top:16px">
                <span data-i18n="learn.khamPhaCanh3dVaXuLyTungTinhHuo" class="small muted">Khám phá cảnh 3D và xử lý từng tình huống — chọn đúng được cộng điểm, chọn sai bị trừ điểm (có thể xuống âm). Không giới hạn số lượt chơi lại.</span>
                <a class="btn" href="/pages/simulation.html?enrollmentId=${enrollmentId}&scenarioSceneId=${step.scenarioSceneId}">
                    ${step.hasEverAttempted ? 'Chơi lại' : t('learn.batDauMoPhong', 'Bắt đầu mô phỏng')}</a>
            </div>`;
    }

    // Định kỳ gửi thời gian đã học + vị trí đang xem dở của video lên server
    function startHeartbeat(lessonId) {
        heartbeatTimer = setInterval(() => {
            API.postSilent(`/progress/lesson/heartbeat?enrollmentId=${enrollmentId}&lessonId=${lessonId}`
                   + `&timeSpentSecond=30&lastPositionSecond=${videoSecond}&maxWatchedSecond=${videoMaxWatched}`)
               .catch(() => {});
        }, 30000);
    }
    function stopHeartbeat() {
        if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    }
})();
</script>
