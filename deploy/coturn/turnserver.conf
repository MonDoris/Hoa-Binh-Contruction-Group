# Cấu hình coturn cho tính năng "Phòng học online" của HB E-Learning.
# Chỉ sửa 2 dòng đánh dấu CẦN SỬA bên dưới rồi triển khai — xem README.md cùng thư mục.

listening-port=3478

# Cổng UDP/TCP dùng để relay media khi 2 máy không nối trực tiếp được (NAT chặt). Mở dải này
# trên firewall của VPS. Có thể thu hẹp lại nếu muốn (VD 49152-50152) để bớt phải mở nhiều cổng.
min-port=49152
max-port=65535

# ---- CẦN SỬA: IP public của VPS (để coturn quảng bá đúng địa chỉ cho client) ----
external-ip=203.0.113.10

# Xác thực bằng secret dùng chung, sinh username/mật khẩu có hạn dùng ngắn (chuẩn TURN REST API) —
# KHÔNG lưu danh sách user/pass cố định. Giá trị secret này phải khớp Y HỆT với "Turn:Secret"
# trong appsettings.json của app HbELearning.
use-auth-secret
# ---- CẦN SỬA: đổi thành 1 chuỗi ngẫu nhiên mạnh, VD tạo bằng lệnh `openssl rand -hex 32` ----
static-auth-secret=REPLACE_WITH_STRONG_RANDOM_SECRET
realm=hbelearning

# An toàn cơ bản: không cho quay ngược vào relay tới các dải IP nội bộ/loopback (chống SSRF qua TURN).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255

stale-nonce=600
fingerprint
no-cli
log-file=stdout
